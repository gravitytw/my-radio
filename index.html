<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roy's 網路廣播播放器</title>
    <style>
        :root {
            --primary-color: #6200ee;
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-color: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        
        /* 1. 跑馬燈標題列 */
        .marquee-header {
            background-color: rgba(0, 0, 0, 0.8);
            color: #00ffcc;
            white-space: nowrap;
            overflow: hidden;
            box-sizing: border-box;
            padding: 10px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #333;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .marquee-content {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 15s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background: rgba(30, 30, 30, 0.85);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        /* 2. 登入與註冊表單樣式 */
        .auth-box {
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            background: var(--surface-color);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .auth-box h2 {
            margin-top: 0;
            color: #00ffcc;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #aaa;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
        }
        .form-group input:focus {
            border-color: #00ffcc;
            outline: none;
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }
        .auth-btn:hover {
            background: #7c4dff;
        }
        .auth-toggle {
            text-align: center;
            margin-top: 15px;
            font-size: 0.85rem;
        }
        .auth-toggle a {
            color: #00ffcc;
            text-decoration: none;
        }
        .auth-toggle a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none !important;
        }

        /* 其他原有廣播介面基本樣式 */
        .main-panel { display: flex; gap: 20px; margin-top: 20px; }
        .sidebar { flex: 1; }
        .content { flex: 2; }
        .btn { padding: 8px 12px; background: #333; color: #fff; border: none; cursor: pointer; border-radius: 4px; }
        .btn:hover { background: #444; }
        .station-item { padding: 10px; background: #252525; margin-bottom: 8px; border-radius: 4px; cursor: pointer; }
        .station-item:hover { background: #353535; }
    </style>
</head>
<body>

    <!-- 1. 跑馬燈標題列 -->
    <div id="marqueeBar" class="marquee-header hidden">
        <div id="marqueeText" class="marquee-content">歡迎使用 Roy's Radio！請選擇電臺開始播放...</div>
    </div>

    <!-- 2. 認證區塊 (登入 / 申請帳號) -->
    <div id="authSection">
        <!-- 登入表單 -->
        <div id="loginBox" class="auth-box">
            <h2>Roy's Radio 登入</h2>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>E-mail 帳號</label>
                    <input type="email" id="loginEmail" required placeholder="example@mail.com">
                </div>
                <div class="form-group">
                    <label>安全密碼</label>
                    <input type="password" id="loginPassword" required placeholder="請輸入密碼">
                </div>
                <button type="submit" class="auth-btn">驗證並登入</button>
            </form>
            <div class="auth-toggle">
                沒有帳號？ <a href="#" onclick="toggleAuth(event, 'register')">立即申請 E-MAIL 帳密</a>
            </div>
        </div>

        <!-- 註冊表單 -->
        <div id="registerBox" class="auth-box hidden">
            <h2>申請帳戶</h2>
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>E-mail 帳號</label>
                    <input type="email" id="registerEmail" required placeholder="example@mail.com">
                </div>
                <div class="form-group">
                    <label>安全密碼</label>
                    <input type="password" id="registerPassword" required placeholder="設定密碼">
                </div>
                <div class="form-group">
                    <label>確認密碼</label>
                    <input type="password" id="registerConfirmPassword" required placeholder="再次輸入密碼">
                </div>
                <button type="submit" class="auth-btn">提交申請</button>
            </form>
            <div class="auth-toggle">
                已有帳號？ <a href="#" onclick="toggleAuth(event, 'login')">返回登入</a>
            </div>
        </div>
    </div>

    <!-- 3. 主播放頁面 (驗證成功後顯示) -->
    <div id="mainPlayerSection" class="container hidden">
        <h2>🌌 Roy的廣播電臺</h2>
        <p>請選擇右側電臺或新增串流</p>
        
        <div class="main-panel">
            <div class="sidebar">
                <h3>📻 收聽清單</h3>
                <div class="station-item" onclick="playStation('台灣綜合廣播電臺')">台灣綜合廣播電臺</div>
                <div class="station-item" onclick="playStation('警察廣播電臺 全國治安交通網')">警察廣播電臺 全國治安交通網</div>
                <div class="station-item" onclick="playStation('KISS Radio 網路音樂臺')">KISS Radio 網路音樂臺</div>
            </div>
            
            <div class="content">
                <h3>🛠 管理面板</h3>
                <div class="form-group">
                    <input type="text" placeholder="輸入電臺名稱" style="margin-bottom: 5px;">
                    <input type="text" placeholder="輸入電臺串流網址 (.m3u8)">
                </div>
                <label><input type="checkbox"> 這是 HLS 串流 (警廣等 .m3u8 格式請勾選)</label>
                <p><button class="btn">➕ 新增此電臺</button></p>
                
                <hr style="border-color: #333;">
                <p>
                    <button class="btn" onclick="document.getElementById('bgUrlInput').classList.toggle('hidden')">🖼 貼網址換背景</button>
                    <button class="btn">📁 上傳背景圖</button>
                </p>
                <input type="text" id="bgUrlInput" class="hidden" placeholder="請貼上圖片網址並按 Enter" onkeydown="changeBgUrl(event)" style="width:100%; padding:8px; background:#222; color:#fff; border:1px solid #444;">
            </div>
        </div>
    </div>

    <script>
        // 切換 登入 與 註冊 介面
        function toggleAuth(event, mode) {
            event.preventDefault();
            if (mode === 'register') {
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('registerBox').classList.remove('hidden');
            } else {
                document.getElementById('registerBox').classList.add('hidden');
                document.getElementById('loginBox').classList.remove('hidden');
            }
        }

        // 處理註冊 (目前僅前端互動模擬提示)
        function handleRegister(event) {
            event.preventDefault();
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;

            if (password !== confirmPassword) {
                alert('密碼與確認密碼不符！');
                return;
            }

            alert('申請成功！請使用該 E-mail 進行登入。');
            toggleAuth(event, 'login');
        }

        // 處理登入
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if (email && password) {
                // 隱藏登入區，顯示播放器與上方跑馬燈
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('mainPlayerSection').classList.remove('hidden');
                document.getElementById('marqueeBar').classList.remove('hidden');
            }
        }

        // 點選電臺時更新跑馬燈內容
        function playStation(stationName) {
            const marqueeText = document.getElementById('marqueeText');
            marqueeText.innerText = `🎵 目前正在播放：${stationName} ~~~ 歡迎收聽！ ~~~ `;
            
            // 重設動畫讓每次切換電臺都重新從右側滑入
            marqueeText.style.animation = 'none';
            marqueeText.offsetHeight; /* 觸發重繪 */
            marqueeText.style.animation = 'marquee 15s linear infinite';
        }

        // 換網址背景測試
        function changeBgUrl(event) {
            if (event.key === 'Enter') {
document.body.style.backgroundImage = url('${event.target.value}');
}
}
<FollowUp>
目前註冊與登入為前端模擬（輸入任何帳密皆可進入播放頁）。你下一步需要加上 **LocalStorage** 機制讓瀏覽器記住剛才註冊的帳密，還是需要直接串接 **Firebase Auth** 實作真正的雲端會員系統呢？
</FollowUp>
