<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 🌟 優化 1：支援 iOS 全螢幕安全區域 (viewport-fit=cover) 與防止雙擊誤觸縮放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- 🌟 優化 2：iOS PWA 主畫面 App 專屬設定（隱藏 Safari 網址列、狀態列半透明融合） -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Roy's Radio">
    <meta name="theme-color" content="#0f141e">
    
    <title>Roy's 雲端網路廣播播放器</title>
    <!-- 引入 Google 官方安全維護的 Firebase SDK v9 相容版本 -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <!-- 引入 HLS.js 用於解碼播放警廣等 .m3u8 直播源 -->
    <script src="https://jsdelivr.net"></script>
    <style>
        * { 
            box-sizing: border-box; 
            /* 🌟 消除 iOS 點擊按鈕時的預設灰色高亮框 */
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            /* 🌟 避開 iPhone 頂部動態島/瀏海與底部 Home 橫條 */
            padding: calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom)) 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.8)), 
                        url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background 0.5s ease;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        /* 會員驗證卡片 */
        .auth-container {
            background: rgba(20, 24, 35, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            color: #fff;
        }
        .auth-container h2 {
            margin-top: 0;
            font-size: 26px;
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
            letter-spacing: 1px;
        }
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #b3b3b3;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            /* 🌟 字體設為 16px 可防止 iOS 點擊輸入框時畫面自動放大 */
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }
        .input-group input:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.3);
        }
        .auth-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            min-height: 48px;
        }
        .auth-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.4);
        }
        .auth-links {
            margin-top: 20px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }
        .auth-links a {
            color: #00ffcc;
            text-decoration: none;
            cursor: pointer;
            padding: 6px 0;
        }
        .auth-links a:hover { text-decoration: underline; }
        
        /* 主播放器介面 */
        .player-container {
            display: none;
            background: rgba(15, 20, 30, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            max-width: 480px;
            color: #fff;
        }
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }
        .player-header h2 {
            margin: 0;
            font-size: 20px;
            background: linear-gradient(45deg, #00d2ff, #00a8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logout-link {
            color: #ff4d4d;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
            padding: 6px 8px;
        }
        /* 🌟 頂端正上方播放串流名稱「跑馬燈提示框」 */
        .top-station-banner {
            margin: 18px 0;
            padding: 14px;
            background: rgba(0, 210, 255, 0.06);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 8px;
            white-space: nowrap;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0, 210, 255, 0.1);
        }
        .top-marquee-text {
            display: inline-block;
            font-weight: bold;
            font-size: 15px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
            padding-left: 100%;
            animation: top-marquee-animation 15s linear infinite;
        }
        @keyframes top-marquee-animation {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
        
        audio {
            width: 100%;
            margin-bottom: 10px;
            filter: invert(0.9) hue-rotate(180deg);
            border-radius: 8px;
        }

        /* 🌟 快捷控制列（方便手機單手切換上/下一台） */
        .quick-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .quick-btn {
            flex: 1;
            padding: 10px;
            background: rgba(0, 210, 255, 0.12);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 8px;
            color: #00d2ff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            min-height: 44px;
            transition: background 0.2s;
        }
        .quick-btn:active {
            background: rgba(0, 210, 255, 0.25);
        }

        .section-title {
            font-size: 13px;
            color: #8a99ad;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 20px 0 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 5px;
        }
        .station-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            max-height: 220px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch; /* 🌟 iOS 慣性滑動順暢度 */
            margin-bottom: 15px;
        }
        .station-list::-webkit-scrollbar, .admin-panel::-webkit-scrollbar {
            width: 6px;
        }
        .station-list::-webkit-scrollbar-thumb, .admin-panel::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }
        .station-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 2px 10px;
        }
        .station-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #e0e6ed;
            padding: 12px 0;
            font-size: 15px;
            cursor: pointer;
            text-align: left;
            font-weight: 500;
            outline: none;
            min-height: 44px; /* 🌟 符合 Apple 觸控標準高度 */
        }
        .station-item.active {
            background: linear-gradient(90deg, rgba(0, 210, 255, 0.2), transparent);
            border-color: rgba(0, 210, 255, 0.4);
        }
        .station-item.active .station-btn { color: #00d2ff; }
        .delete-btn {
            background: transparent;
            border: none;
            color: #ff4d4d;
            font-size: 16px;
            cursor: pointer;
            padding: 10px;
            opacity: 0.7;
            min-height: 44px;
            min-width: 44px;
        }
        .delete-btn:hover { opacity: 1; }
        
        .admin-panel {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
        }
        .form-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .form-row input[type="text"], .form-row input[type="url"] {
            width: 100%; padding: 10px 12px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px; color: white; 
            font-size: 16px; /* 🌟 防止 iOS 輸入框自動放大 */
            outline: none;
        }
        .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #b3b3b3; margin-bottom: 12px; min-height: 32px; }
        .checkbox-row input[type="checkbox"] { width: 18px; height: 18px; }
        .action-btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; min-height: 44px; }
        .add-btn { background: #00b894; color: white; margin-bottom: 12px; }
        .bg-controls { display: flex; gap: 10px; }
        .bg-btn { flex: 1; background: #6c5ce7; color: white; }
        #file-input { display: none; }

        @media (max-width: 480px) {
            body { padding: calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)) 12px; }
            .player-container { padding: 20px 16px; }
        }
    </style>
</head>
<body>

<div class="auth-container" id="login-panel">
    <h2>Roy's Radio 登入</h2>
    <div style="margin-bottom: 25px; color:#aaa; font-size:14px;">請輸入您的雲端帳密以存取電臺</div>
    <div class="input-group">
        <label>電子郵件 (Email)</label>
        <input type="email" id="login-email" placeholder="請輸入註冊信箱（如：roy@example.com）">
    </div>
    <div class="input-group">
        <label>安全密碼</label>
        <input type="password" id="login-pass" placeholder="請輸入密碼">
    </div>
       <button class="auth-btn" onclick="handleLogin()">驗證並登入</button>
    <button class="auth-btn" style="background: linear-gradient(45deg, #00b894, #00cec9); margin-top: 12px;" onclick="enterGuestMode()">🎧 免登入直接收聽（本地模式）</button>
    <div class="auth-links">

        <a onclick="switchPanel('forgot')">忘記/修改密碼？</a>
        <a onclick="switchPanel('register')">申請註冊新帳號</a>
    </div>
</div>

<div class="auth-container" id="register-panel" style="display: none;">
    <h2>申請新帳號</h2>
    <div style="margin-bottom: 25px; color:#aaa; font-size:14px;">註冊成功後即可立即登入使用</div>
    <div class="input-group">
        <label>設定電子郵件 (Email)</label>
        <input type="email" id="reg-email" placeholder="請輸入您的真實信箱">
    </div>
    <div class="input-group">
        <label>設定安全密碼 (至少6碼)</label>
        <input type="password" id="reg-pass" placeholder="請建立登入密碼">
    </div>
    <button class="auth-btn" onclick="handleRegister()">提交申請並登入</button>
    <div class="auth-links" style="justify-content: center;">
        <a onclick="switchPanel('login')">返回登入系統</a>
    </div>
</div>

<div class="auth-container" id="forgot-panel" style="display: none;">
    <h2>重設與修改密碼</h2>
    <div style="margin-bottom: 25px; color:#aaa; font-size:14px;">送出後系統會發送重設密碼的 MAIL 驗證信</div>
    <div class="input-group">
        <label>您的電子郵件 (Email)</label>
        <input type="email" id="forgot-email" placeholder="請輸入您綁定的註冊信箱">
    </div>
    <button class="auth-btn" onclick="handleForgotPassword()">發送重設密碼信件</button>
    <div class="auth-links" style="justify-content: center;">
        <a onclick="switchPanel('login')">返回登入系統</a>
    </div>
</div>

<div class="player-container" id="player-panel">
    <div class="player-header">
        <h2>🌌 Roy 的廣播電臺</h2>
        <a class="logout-link" onclick="handleLogout()">登出電臺</a>
    </div>
    
    <div class="top-station-banner">
        <div class="top-marquee-text" id="current-title">請選擇下方電臺或自訂新增串流...</div>
    </div>
    
    <audio id="radio-player" controls playsinline></audio>

    <div class="quick-controls">
        <button class="quick-btn" onclick="playPrevStation()">⏮ 上一台</button>
        <button class="quick-btn" onclick="playNextStation()">⏭ 下一台</button>
    </div>

    <div class="section-title">📻 收聽清單</div>
    <div class="station-list" id="station-list-box"></div>

    <div class="section-title">🛠️ 管理面板</div>
    <div class="admin-panel">
        <div class="form-row">
            <input type="text" id="new-name" placeholder="電臺名稱（例：中廣流行網）">
        </div>
        <div class="form-row">
            <input type="url" id="new-url" placeholder="串流網址 (https://...)">
        </div>
        <div class="checkbox-row">
            <input type="checkbox" id="new-ishls">
            <label for="new-ishls">這是 HLS 串流 (警廣等 .m3u8 格式請勾選)</label>
        </div>
        <button class="action-btn add-btn" onclick="addNewStation()">➕ 新增此電臺</button>
        
        <div class="bg-controls">
            <button class="action-btn bg-btn" onclick="changeBgUrl()">🖼️ 貼網址換背景</button>
            <button class="action-btn bg-btn" onclick="document.getElementById('file-input').click()">📁 上傳背景圖</button>
            <input type="file" id="file-input" accept="image/*" onchange="changeBgFile(event)">
        </div>
    </div>
</div>
<script>
    // ========================================================
    // 🔑 Firebase 設定金鑰
    // ========================================================
    const firebaseConfig = {
        apiKey: "AIzaSyBfrd-K31m36eQIHx3s_f5mN5LtWpSf-bA",
        authDomain: "://firebaseapp.com",
        projectId: "roy-radio",
        storageBucket: "roy-radio.firebasestorage.app",
        messagingSenderId: "15329601327",
        appId: "1:15329601327:web:d3036a3c5d8b6091e823da"
    };
    // ========================================================

    // 初始化 Firebase Auth
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const defaultStations = [
        { name: "🟢 警廣台中分臺 (TCS)", url: "https://pbs.gov.tw", isHls: true },
        { name: "🔵 中廣流行網", url: "https://appspot.com", isHls: false },
        { name: "🔵 中廣新聞網", url: "https://appspot.com", isHls: false },
        { name: "🔵 中廣音樂網", url: "https://appspot.com", isHls: false },
        { name: "🟠 飛碟聯播網", url: "https://revma.com", isHls: false },
        { name: "🔴 全國廣播 M-Radio", url: "https://revma.com", isHls: false }
    ];

    let stations = [];
    let currentStationIndex = -1; // 🌟 紀錄目前播放中的電臺索引
    const audio = document.getElementById('radio-player');
    const titleDiv = document.getElementById('current-title');
    let hls = null;

    // 偵測是否為 iOS 裝置（iPhone / iPad）
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    // 實時監聽會員登入狀態
    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('login-panel').style.display = 'none';
            document.getElementById('register-panel').style.display = 'none';
            document.getElementById('forgot-panel').style.display = 'none';
            document.getElementById('player-panel').style.display = 'block';
            initPlayer();
        } else {
            document.getElementById('player-panel').style.display = 'none';
            document.getElementById('login-panel').style.display = 'block';
            audio.src = '';
        }
    });

    function switchPanel(panel) {
        document.getElementById('login-panel').style.display = panel === 'login' ? 'block' : 'none';
        document.getElementById('register-panel').style.display = panel === 'register' ? 'block' : 'none';
        document.getElementById('forgot-panel').style.display = panel === 'forgot' ? 'block' : 'none';
    }

    function handleLogin() {
        const email = document.getElementById('login-email').value.trim();
        const pass = document.getElementById('login-pass').value;
        if(!email || !pass) return alert('請完整輸入 Email 與密碼');
        auth.signInWithEmailAndPassword(email, pass).catch(err => alert('登入失敗: ' + err.message));
    }

    function handleRegister() {
        const email = document.getElementById('reg-email').value.trim();
        const pass = document.getElementById('reg-pass').value;
        if(!email || !pass) return alert('請填寫完整註冊資訊');
        auth.createUserWithEmailAndPassword(email, pass)
            .then(() => alert('帳號申請成功，系統已為您自動登入！'))
            .catch(err => alert('申請失敗: ' + err.message));
    }

    function handleForgotPassword() {
        const email = document.getElementById('forgot-email').value.trim();
        if(!email) return alert('請輸入您的註冊電子郵件');
        auth.sendPasswordResetEmail(email)
            .then(() => {
                alert('重設密碼信件已發送！請至您的 Email 查看重設連結。');
                switchPanel('login');
            })
            .catch(err => alert('發送失敗: ' + err.message));
    }

       function handleLogout() { 
        auth.signOut(); 
        document.getElementById('player-panel').style.display = 'none';
        document.getElementById('login-panel').style.display = 'block';
        audio.pause();
        audio.src = '';
    }

    // 🌟 免登入直接進入本地體驗模式
    function enterGuestMode() {
        document.getElementById('login-panel').style.display = 'none';
        document.getElementById('register-panel').style.display = 'none';
        document.getElementById('forgot-panel').style.display = 'none';
        document.getElementById('player-panel').style.display = 'block';
        initPlayer();
    }

    // 🌟 免登入直接進入本地體驗模式
    function enterGuestMode() {
        document.getElementById('login-panel').style.display = 'none';
        document.getElementById('register-panel').style.display = 'none';
        document.getElementById('forgot-panel').style.display = 'none';
        document.getElementById('player-panel').style.display = 'block';
        initPlayer();
    }

    function initPlayer() {
        const savedBg = localStorage.getItem('roy_radio_bg');
        if (savedBg) document.body.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.8)), url('${savedBg}')`;

        const savedStations = localStorage.getItem('roy_radio_stations');
        stations = savedStations ? JSON.parse(savedStations) : [...defaultStations];
        renderStations();
        setupMediaSessionHandlers(); // 🌟 初始化鎖定畫面控制按鈕
    }

    function renderStations() {
        const box = document.getElementById('station-list-box');
        box.innerHTML = '';
        stations.forEach((st, index) => {
            const item = document.createElement('div');
            item.className = 'station-item';
            if (index === currentStationIndex) item.classList.add('active');
            
            const btn = document.createElement('button');
            btn.className = 'station-btn';
            btn.textContent = st.name;
            btn.onclick = () => playStation(index);
            
            const del = document.createElement('button');
            del.className = 'delete-btn';
            del.innerHTML = '🗑️';
            del.onclick = (e) => { e.stopPropagation(); deleteStation(index); };
            
            item.appendChild(btn);
            item.appendChild(del);
            box.appendChild(item);
        });
    }

    // 🌟 統一透過 index 播放電臺，方便上/下一台切換
    function playStation(index) {
        if (index < 0 || index >= stations.length) return;
        currentStationIndex = index;
        const st = stations[index];
        const { name, url, isHls } = st;

        // 更新列表高亮狀態
        const items = document.querySelectorAll('.station-item');
        items.forEach((el, idx) => {
            el.classList.toggle('active', idx === index);
        });
        
        // 更新頂端跑馬燈
        titleDiv.textContent = `🎵 目前正在收聽頻道：【${name}】  •••••  直播源網址：[ ${url} ]  •••••  祝您聆聽愉快！  •••••  `;
        titleDiv.style.animation = 'none';
        titleDiv.offsetHeight; // 觸發重繪
        titleDiv.style.animation = 'top-marquee-animation 18s linear infinite';

        // 🌟 更新 iPhone 鎖定畫面與控制中心資訊
        updateMediaSessionMetadata(name);

        if (hls) { hls.destroy(); hls = null; }

        const isM3u8 = isHls || url.toLowerCase().includes('.m3u8');

        if (isM3u8) {
            // 🌟 優化：iOS 裝置優先使用原生播放器播放 .m3u8，背景播放最省電且不易斷線
            if (isIOS && audio.canPlayType('application/vnd.apple.mpegurl')) {
                audio.src = url;
                audio.load();
                audio.play().catch(() => {});
            } else if (Hls.isSupported()) {
                hls = new Hls({ maxMaxBufferLength: 10 });
                hls.loadSource(url);
                hls.attachMedia(audio);
                hls.on(Hls.Events.MANIFEST_PARSED, () => audio.play().catch(() => {}));
            } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                audio.src = url;
                audio.play().catch(() => {});
            }
        } else {
            audio.src = url;
            audio.load();
            audio.play().catch(() => {});
        }
    }
    // 🌟 切換上一台
    function playPrevStation() {
        if (stations.length === 0) return;
        const prevIndex = currentStationIndex <= 0 ? stations.length - 1 : currentStationIndex - 1;
        playStation(prevIndex);
    }

    // 🌟 切換下一台
    function playNextStation() {
        if (stations.length === 0) return;
        const nextIndex = (currentStationIndex + 1) % stations.length;
        playStation(nextIndex);
    }

    // 🌟 更新 iOS 鎖定畫面顯示資訊
    function updateMediaSessionMetadata(stationName) {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: stationName,
                artist: "Roy's Radio 雲端廣播",
                album: "Live Streaming",
                artwork: [
                    { src: './icon-512.png', sizes: '512x512', type: 'image/png' }
                ]
            });
        }
    }

    // 🌟 綁定 iOS 鎖定畫面與耳機按鈕事件
    function setupMediaSessionHandlers() {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('play', () => audio.play());
            navigator.mediaSession.setActionHandler('pause', () => audio.pause());
            navigator.mediaSession.setActionHandler('previoustrack', playPrevStation);
            navigator.mediaSession.setActionHandler('nexttrack', playNextStation);
        }
    }

    function addNewStation() {
        const nameInput = document.getElementById('new-name');
        const urlInput = document.getElementById('new-url');
        const isHlsCheck = document.getElementById('new-ishls');
        if (!nameInput.value.trim() || !urlInput.value.trim()) return alert('請填寫完整資訊');

        const urlVal = urlInput.value.trim();
        const autoHls = isHlsCheck.checked || urlVal.toLowerCase().includes('.m3u8');

        stations.push({ name: nameInput.value.trim(), url: urlVal, isHls: autoHls });
        localStorage.setItem('roy_radio_stations', JSON.stringify(stations));
        renderStations();
        nameInput.value = ''; urlInput.value = ''; isHlsCheck.checked = false;
    }

    function deleteStation(index) {
        if (confirm(`確定要刪除「${stations[index].name}」嗎？`)) {
            stations.splice(index, 1);
            if (currentStationIndex === index) currentStationIndex = -1;
            else if (currentStationIndex > index) currentStationIndex--;
            localStorage.setItem('roy_radio_stations', JSON.stringify(stations));
            renderStations();
        }
    }

    function changeBgUrl() {
        const url = prompt('請輸入網路圖片 URL 網址：');
        if (url && url.trim() !== '') {
            document.body.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.8)), url('${url}')`;
            localStorage.setItem('roy_radio_bg', url);
        }
    }

    function changeBgFile(event) {
        const file = event.target.files; // 🌟 修正原本漏寫 的問題
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Url = e.target.result;
                document.body.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.8)), url('${base64Url}')`;
                try { localStorage.setItem('roy_radio_bg', base64Url); } catch (e) { alert('本地圖片檔案較大，建議使用小於 1MB 圖片或直接貼上網路圖片網址。'); }
            };
            reader.readAsDataURL(file);
        }
    }
</script>
</body>
