<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的網路廣播播放器</title>
    <!-- 引入 HLS.js 用於順暢播放警廣 HLS 安全串流 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .player-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 24px;
        }
        .now-playing {
            margin: 15px 0;
            padding: 10px;
            background-color: #eef2f5;
            border-radius: 8px;
            font-weight: bold;
            color: #16a085;
            min-height: 24px;
        }
        audio {
            width: 100%;
            margin: 20px 0;
        }
        .station-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .station-btn {
            background-color: #ffffff;
            border: 2px solid #dcdde1;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            font-weight: 500;
        }
        .station-btn:hover {
            background-color: #f5f6fa;
            border-color: #3498db;
            color: #3498db;
        }
        .station-btn.active {
            background-color: #3498db;
            border-color: #3498db;
            color: white;
        }
    </style>
</head>
<body>

<div class="player-container">
    <h2>📻 網路廣播電臺</h2>
    <div class="now-playing" id="current-title">請選擇電臺收聽</div>
    
    <!-- 網頁原生音訊播放器 -->
    <audio id="radio-player" controls></audio>

    <div class="station-list">
        <!-- 已將警廣網址修改為最新 HTTPS 安全直播源 -->
        <button class="station-btn" onclick="playStation('警廣台中分臺 (TCS)', 'https://stream.pbs.gov.tw/live/TCS/playlist.m3u8', this, true)">🟢 警廣台中分臺 (TCS)</button>
        <button class="station-btn" onclick="playStation('中廣流行網', 'https://sonnykuo.appspot.com/bcc/?id=中廣流行網', this, false)">🔵 中廣流行網</button>
        <button class="station-btn" onclick="playStation('中廣新聞網', 'https://sonnykuo.appspot.com/bcc/?id=中廣新聞網', this, false)">🔵 中廣新聞網</button>
        <button class="station-btn" onclick="playStation('中廣音樂網', 'https://sonnykuo.appspot.com/bcc/?id=中廣音樂網', this, false)">🔵 中廣音樂網</button>
        <button class="station-btn" onclick="playStation('飛碟聯播網', 'https://stream.rcs.revma.com/em90w4aeewzuv.m4a', this, false)">🟠 飛碟聯播網</button>
        <button class="station-btn" onclick="playStation('全國廣播 M-Radio', 'https://stream.rcs.revma.com/044q61ha7a0uv', this, false)">🔴 全國廣播 M-Radio</button>
    </div>
</div>

<script>
    const audio = document.getElementById('radio-player');
    const titleDiv = document.getElementById('current-title');
    let hls = null;

    function playStation(name, url, btnElement, isHls) {
        // 更新按鈕選取狀態
        document.querySelectorAll('.station-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
        
        // 更新顯示名稱
        titleDiv.textContent = `正在播放：${name}`;

        // 清理先前可能存在的 HLS 實例
        if (hls) {
            hls.destroy();
            hls = null;
        }

        // HLS 串流規格處理 (.m3u8 格式)
        if (isHls) {
            if (Hls.isSupported()) {
                hls = new Hls({
                    maxMaxBufferLength: 10 // 優化直播即時緩衝
                });
                hls.loadSource(url);
                hls.attachMedia(audio);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    audio.play().catch(e => console.log("等待使用者手動點擊播放"));
                });
                
                // 錯誤自動重連機制
                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                console.log("網路連線錯誤，嘗試重新載入...");
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                console.log("解碼錯誤，嘗試修復...");
                                hls.recoverMediaError();
                                break;
                            default:
                                break;
                        }
                    }
                });
            } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                // 針對 iOS Safari 原生支援 HLS 的處理
                audio.src = url;
                audio.addEventListener('loadedmetadata', function() {
                    audio.play().catch(e => console.log("等待 iOS 使用者手動點擊播放"));
                });
            } else {
                alert('您的瀏覽器不支援播放此 HLS 串流格式。');
            }
        } else {
            // 一般音訊串流處理 (.m4a / MP3 等直接音訊)
            audio.src = url;
            audio.load();
            audio.play().catch(error => {
                console.log("自動播放受瀏覽器政策攔截，請手動點擊播放鈕。", error);
            });
        }
    }
</script>

</body>
</html>
