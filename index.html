<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roy's 雲端網路廣播播放器</title>
    <!-- 引入完整的 HLS.js 用於播放 .m3u8 格式 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js"></script>
    <style>
        :root {
            --primary-color: #6366f1;
            --bg-overlay: rgba(15, 23, 42, 0.85);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('https://images.unsplash.com/photo-1614149162883-504ce4d13909?q=80&w=1920'); /* 預設固定高質感深色背景圖 */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .container {
            background: var(--bg-overlay);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            backdrop-filter: blur(10px);
            box-sizing: border-box;
        }

        .card { display: none; }
        .card.active { display: block; }

        h2 {
            margin-top: 0;
            color: #fff;
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        input[type="email"], input[type="password"], input[type="text"], select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #1e293b;
            color: #fff;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            background: var(--primary-color);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }

        button:hover { background: #4f46e5; }

        .links {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.875rem;
        }

        .links a {
            color: #a5b4fc;
            text-decoration: none;
            margin: 0 0.5rem;
        }

        /* 網頁內跑馬燈樣式 */
        .marquee-container {
            background: #0f172a;
            padding: 0.5rem;
            border-radius: 8px;
            overflow: hidden;
            white-space: nowrap;
            margin-bottom: 1.5rem;
            border: 1px solid #334155;
        }

        .marquee-text {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 15s linear infinite;
            color: #38bdf8;
            font-weight: bold;
        }

        @keyframes marquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        .radio-list {
            margin: 1.5rem 0;
        }

        .audio-player {
            width: 100%;
            margin-top: 1rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            font-size: 0.875rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. 登入區塊 -->
    <div id="loginCard" class="card active">
        <h2>📻 Roy's Radio 登入</h2>
        <div class="form-group">
            <label>電子郵件 (Email)</label>
            <input type="email" id="loginEmail" placeholder="example@email.com">
        </div>
        <div class="form-group">
            <label>安全密碼</label>
            <input type="password" id="loginPwd" placeholder="請輸入密碼">
        </div>
        <button onclick="handleLogin()">驗證並登入</button>
        <div class="links">
            <a href="#" onclick="switchCard('registerCard')">申請註冊新帳號</a>
        </div>
    </div>

    <!-- 2. 註冊區塊 -->
    <div id="registerCard" class="card">
        <h2>📝 申請新帳號</h2>
        <div class="form-group">
            <label>設定電子郵件 (Email)</label>
            <input type="email" id="regEmail" placeholder="example@email.com">
        </div>
        <div class="form-group">
            <label>設定安全密碼 (至少6碼)</label>
            <input type="password" id="regPwd" placeholder="請輸入密碼">
        </div>
        <button onclick="handleRegister()">提交申請並登入</button>
        <div class="links">
            <a href="#" onclick="switchCard('loginCard')">返回登入系統</a>
        </div>
    </div>

    <!-- 3. 播放器主頁面 -->
    <div id="playerCard" class="card">
        <!-- 上方跑馬燈 -->
        <div class="marquee-container">
            <div id="marqueeText" class="marquee-text">歡迎來到 Roy 的廣播電臺，請選擇電臺開始收聽...</div>
        </div>

        <h2>🌌 Roy 的廣播電臺</h2>
        
        <div class="radio-list">
            <label>📻 收聽清單</label>
            <select id="stationSelect" onchange="playStation()">
                <option value="">-- 請選擇電臺 --</option>
                <option value="https://classicoldies.stream.publicradio.org/classicoldies.mp3" data-hls="false">經典老歌電臺 (範例 MP3)</option>
                <option value="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" data-hls="true">測試 HLS 電臺 (範例 .m3u8)</option>
            </select>
        </div>

        <audio id="audioPlayer" class="audio-player" controls></audio>

        <!-- 管理面板 (新增自訂串流) -->
        <div style="margin-top: 2rem; border-top: 1px solid #334155; padding-top: 1rem;">
            <label>🛠 管理面板 (自訂新增串流)</label>
            <div class="form-group" style="margin-top: 0.5rem;">
                <input type="text" id="newStationName" placeholder="電臺名稱">
            </div>
            <div class="form-group">
                <input type="text" id="newStationUrl" placeholder="串流網址 (URL)">
                <div class="checkbox-group">
                    <input type="checkbox" id="isHls">
                    <label for="isHls">這是 HLS 串流 (警廣等 .m3u8 格式請勾選)</label>
                </div>
            </div>
            <button onclick="addNewStation()">➕ 新增此電臺</button>
        </div>

        <button onclick="handleLogout()" style="background: #ef4444; margin-top: 1.5rem;">登出電臺</button>
    </div>
</div>

<script>
    // 預設帳密儲存庫 (使用 localStorage)
    let users = JSON.parse(localStorage.getItem('radio_users')) || {};
    let hls = null;
    let titleInterval = null;

    // 切換畫面
    function switchCard(cardId) {
        document.querySelectorAll('.card').forEach(card => card.classList.remove('active'));
        document.getElementById(cardId).classList.add('active');
    }

    // 處理註冊
    function handleRegister() {
        const email = document.getElementById('regEmail').value.trim();
        const pwd = document.getElementById('regPwd').value;

        if (!email || pwd.length < 6) {
            alert('請輸入正確的 Email 且密碼至少需要 6 個字元！');
            return;
        }

        if (users[email]) {
            alert('此 Email 已被註冊！');
            return;
        }

        users[email] = pwd;
        localStorage.setItem('radio_users', JSON.stringify(users));
        alert('註冊成功！已為您自動登入。');
        switchCard('playerCard');
    }

    // 處理登入
    function handleLogin() {
        const email = document.getElementById('loginEmail').value.trim();
        const pwd = document.getElementById('loginPwd').value;

        if (users[email] && users[email] === pwd) {
            switchCard('playerCard');
        } else {
            alert('電子郵件或密碼錯誤，請重試。');
        }
    }

    // 處理登出
    function handleLogout() {
        const audio = document.getElementById('audioPlayer');
        audio.pause();
        stopTitleMarquee();
        document.title = "Roy's 雲端網路廣播播放器";
        switchCard('loginCard');
    }

    // 新增自訂電臺
    function addNewStation() {
        const name = document.getElementById('newStationName').value.trim();
        const url = document.getElementById('newStationUrl').value.trim();
        const isHls = document.getElementById('isHls').checked;

        if (!name || !url) {
            alert('請輸入電臺名稱與網址！');
            return;
        }

        const select = document.getElementById('stationSelect');
        const option = document.createElement('option');
        option.value = url;
        option.text = name;
        option.setAttribute('data-hls', isHls ? 'true' : 'false');
        select.add(option);

        // 清空欄位
        document.getElementById('newStationName').value = '';
        document.getElementById('newStationUrl').value = '';
        document.getElementById('isHls').checked = false;
        alert('電臺新增成功！');
    }

    // 播放選擇的電臺
    function playStation() {
        const select = document.getElementById('stationSelect');
        const selectedOption = select.options[select.selectedIndex];
        const url = select.value;
        const isHlsStr = selectedOption.getAttribute('data-hls');
        const stationName = selectedOption.text;
        
        const audio = document.getElementById('audioPlayer');

        if (!url) {
            audio.pause();
            updateMarquee("歡迎來到 Roy 的廣播電臺，請選擇電臺開始收聽...");
            stopTitleMarquee();
            document.title = "Roy's 雲端網路廣播播放器";
            return;
        }

        // 更新文字內容
        const playText = `正在播放：${stationName} 🎵 串流網址: ${url} `;
        updateMarquee(playText);
        startTitleMarquee(playText);

        // 處理 HLS 串流與一般音訊
        if (hls) {
            hls.destroy();
            hls = null;
        }

        if (isHlsStr === 'true') {
            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(audio);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    audio.play();
                });
            } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                audio.src = url;
                audio.play();
            } else {
                alert('您的瀏覽器不支援 HLS 播放');
            }
        } else {
            audio.src = url;
            audio.play();
        }
    }

    // 更新網頁內跑馬燈
    function updateMarquee(text) {
        document.getElementById('marqueeText').innerText = text;
    }

    // 啟動瀏覽器標題跑馬燈
    function startTitleMarquee(text) {
        stopTitleMarquee();
        let displayCtx = text + "   ";
        titleInterval = setInterval(() => {
            displayCtx = displayCtx.substring(1) + displayCtx.substring(0, 1);
            document.title = displayCtx;
        }, 400); // 每 0.4 秒滾動一次
    }

    // 停止瀏覽器標題跑馬燈
    function stopTitleMarquee() {
        if (titleInterval) {
            clearInterval(titleInterval);
            titleInterval = null;
        }
    }
</script>
</body>
</html>
