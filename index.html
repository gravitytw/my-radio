<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roy's 雲端網路廣播播放器</title>
    <!-- 引入 HLS.js 用於播放 .m3u8 格式 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js"></script>
    <style>
        :root {
            --primary-color: #6366f1;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --bg-overlay: rgba(15, 23, 42, 0.85);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('https://images.unsplash.com/photo-1614149162883-504ce4d13909?q=80&w=1200&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .container {
            background: var(--bg-overlay);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            backdrop-filter: blur(10px);
            box-sizing: border-box;
            margin: 20px;
        }

        .card { display: none; }
        .card.active { display: block; }

        h2 {
            margin-top: 0;
            color: #fff;
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        input[type="email"], input[type="password"], input[type="text"], select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #1e293b;
            color: #fff;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            background: var(--primary-color);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }

        button:hover { background: #4f46e5; }

        .links {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.875rem;
        }

        .links a {
            color: #a5b4fc;
            text-decoration: none;
            margin: 0 0.5rem;
        }

        /* 網頁內跑馬燈樣式 */
        .marquee-container {
            background: #0f172a;
            padding: 0.5rem;
            border-radius: 8px;
            overflow: hidden;
            white-space: nowrap;
            margin-bottom: 1.5rem;
            border: 1px solid #334155;
        }

        .marquee-text {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 15s linear infinite;
            color: #38bdf8;
            font-weight: bold;
        }

        @keyframes marquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        .radio-list {
            margin: 1.5rem 0;
        }

        .audio-player {
            width: 100%;
            margin-top: 1rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            font-size: 0.875rem;
            color: #94a3b8;
        }

        /* 電台列表管理表格 */
        .station-table-container {
            margin-top: 1.5rem;
            border-top: 1px solid #334155;
            padding-top: 1rem;
            max-height: 250px;
            overflow-y: auto;
        }

        .station-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            margin-bottom: 0.5rem;
            border: 1px solid #334155;
            font-size: 0.9rem;
        }

        .station-info {
            flex-grow: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-right: 0.5rem;
        }

        .station-actions {
            display: flex;
            gap: 0.25rem;
            flex-shrink: 0;
        }

        .btn-sm {
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            border-radius: 4px;
            width: auto;
            margin-top: 0;
        }
        .btn-edit { background: var(--success-color); }
        .btn-edit:hover { background: #059669; }
        .btn-del { background: var(--danger-color); }
        .btn-del:hover { background: #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. 登入區塊 -->
    <div id="loginCard" class="card active">
        <h2>📻 Roy's Radio 登入</h2>
        <div class="form-group">
            <label>電子郵件 (Email)</label>
            <input type="email" id="loginEmail" placeholder="example@email.com">
        </div>
        <div class="form-group">
            <label>安全密碼</label>
            <input type="password" id="loginPwd" placeholder="請輸入密碼">
        </div>
        <button onclick="handleLogin()">驗證並登入</button>
        <div class="links">
            <a href="#" onclick="switchCard('registerCard')">申請註冊新帳號</a>
        </div>
    </div>

    <!-- 2. 註冊區塊 -->
    <div id="registerCard" class="card">
        <h2>📝 申請新帳號</h2>
        <div class="form-group">
            <label>設定電子郵件 (Email)</label>
            <input type="email" id="regEmail" placeholder="example@email.com">
        </div>
        <div class="form-group">
            <label>設定安全密碼 (至少6碼)</label>
            <input type="password" id="regPwd" placeholder="請輸入密碼">
        </div>
        <button onclick="handleRegister()">提交申請並登入</button>
        <div class="links">
            <a href="#" onclick="switchCard('loginCard')">返回登入系統</a>
        </div>
    </div>

    <!-- 3. 播放器主頁面 -->
    <div id="playerCard" class="card">
        <!-- 上方跑馬燈 -->
        <div class="marquee-container">
            <div id="marqueeText" class="marquee-text">歡迎來到 Roy 的廣播電臺，請選擇電臺開始收聽...</div>
        </div>

        <h2>🌌 Roy 的廣播電臺</h2>
        
        <div class="radio-list">
            <label>📻 收聽清單</label>
            <select id="stationSelect" onchange="playStation()">
                <option value="">-- 請選擇電臺 --</option>
            </select>
        </div>

        <audio id="audioPlayer" class="audio-player" controls></audio>

        <!-- 管理面板 (新增與編輯自訂串流) -->
        <div style="margin-top: 2rem; border-top: 1px solid #334155; padding-top: 1rem;">
            <label id="panelTitle">🛠 管理面板 (新增自訂串流)</label>
            <input type="hidden" id="editIndex" value="-1">
            <div class="form-group" style="margin-top: 0.5rem;">
                <input type="text" id="stationName" placeholder="電臺名稱">
            </div>
            <div class="form-group">
                <input type="text" id="stationUrl" placeholder="串流網址 (URL)">
                <div class="checkbox-group">
                    <input type="checkbox" id="isHls">
                    <label for="isHls">這是 HLS 串流 (警廣等 .m3u8 格式請勾選)</label>
                </div>
            </div>
            <button id="saveBtn" onclick="saveStation()">➕ 新增此電臺</button>
            <button id="cancelEditBtn" onclick="cancelEdit()" style="background: #64748b; display: none; margin-top: 0.5rem;">取消修改</button>
        </div>

        <!-- 收聽清單管理列表 -->
        <div class="station-table-container">
            <label>📋 管理收聽清單 (可編輯/刪除)</label>
            <div id="stationListContainer" style="margin-top: 0.5rem;">
                <!-- 動態渲染電台項目 -->
            </div>
        </div>

        <button onclick="handleLogout()" style="background: #ef4444; margin-top: 1.5rem;">登出電臺</button>
    </div>
</div>

<script>
    // 帳密儲存庫與電台清單儲存庫 (使用 localStorage 保持資料)
    let users = JSON.parse(localStorage.getItem('radio_users')) || {};
    
    // 預設電台資料
    let defaultStations = [
        { name: "中廣流行網 i-like", url: "https://stream.bcc.com.tw/bcc_i_like_radio", hls: false },
        { name: "警察廣播電臺 (範例 HLS)", url: "https://hls.ner.gov.tw/live/channel1/index.m3u8", hls: true }
    ];
    let stations = JSON.parse(localStorage.getItem('radio_stations')) || defaultStations;

    let hlsPlayer = null;
    let titleInterval = null;

    // 初始化網頁渲染
    document.addEventListener("DOMContentLoaded", () => {
        renderStationDropdown();
        renderStationList();
    });

    // 切換畫面
    function switchCard(cardId) {
        document.querySelectorAll('.card').forEach(card => card.classList.remove('active'));
        document.getElementById(cardId).classList.add('active');
    }

    // 處理註冊
    function handleRegister() {
        const email = document.getElementById('regEmail').value.trim();
        const pwd = document.getElementById('regPwd').value;

        if (!email || pwd.length < 6) {
            alert('請輸入正確的 Email 且密碼至少需要 6 個字元！');
            return;
        }

        if (users[email]) {
            alert('此 Email 已被註冊！');
            return;
        }

        users[email] = pwd;
        localStorage.setItem('radio_users', JSON.stringify(users));
        alert('註冊成功！已為您自動登入。');
        switchCard('playerCard');
    }

    // 處理登入
    function handleLogin() {
        const email = document.getElementById('loginEmail').value.trim();
        const pwd = document.getElementById('loginPwd').value;

        if (users[email] && users[email] === pwd) {
            switchCard('playerCard');
        } else {
            alert('電子郵件或密碼錯誤，請重試。');
        }
    }

    // 處理登出
    function handleLogout() {
        const audio = document.getElementById('audioPlayer');
        audio.pause();
        stopTitleMarquee();
        document.title = "Roy's 雲端網路廣播播放器";
        switchCard('loginCard');
    }

    // 渲染電台下拉選單
    function renderStationDropdown() {
        const select = document.getElementById('stationSelect');
        // 保留第一個預設選項
        select.innerHTML = '<option value="">-- 請選擇電臺 --</option>';
        
        stations.forEach((station, index) => {
            const option = document.createElement('option');
            option.value = station.url;
            option.text = station.name;
            option.setAttribute('data-hls', station.hls ? 'true' : 'false');
            option.setAttribute('data-index', index);
            select.add(option);
        });
    }

    // 渲染管理清單 (修改與移除面板)
    function renderStationList() {
        const container = document.getElementById('stationListContainer');
        container.innerHTML = '';

        if (stations.length === 0) {
            container.innerHTML = '<div style="color:#64748b; font-size:0.85rem; text-align:center;">目前無自訂電台</div>';
            return;
        }

        stations.forEach((station, index) => {
            const item = document.createElement('div');
            item.className = 'station-item';
            item.innerHTML = `
                <div class="station-info">
                    <strong>${station.name}</strong><br>
                    <span style="font-size:0.75rem; color:#64748b;">${station.url}</span>
                </div>
                <div class="station-actions">
                    <button class="btn-sm btn-edit" onclick="startEditStation(${index})">修改</button>
                    <button class="btn-sm btn-del" onclick="deleteStation(${index})">刪除</button>
                </div>
            `;
            container.appendChild(item);
        });
    }

    // 儲存電台 (新增或更新)
    function saveStation() {
        const name = document.getElementById('stationName').value.trim();
        const url = document.getElementById('stationUrl').value.trim();
        const isHls = document.getElementById('isHls').checked;
        const editIndex = parseInt(document.getElementById('editIndex').value);

        if (!name || !url) {
            alert('請輸入電臺名稱與網址！');
            return;
        }

        if (editIndex === -1) {
            // 新增
            stations.push({ name, url, hls: isHls });
            alert('電臺新增成功！');
        } else {
            // 修改更新
            stations[editIndex] = { name, url, hls: isHls };
            alert('電臺更新成功！');
            cancelEdit();
        }

        localStorage.setItem('radio_stations', JSON.stringify(stations));
        renderStationDropdown();
        renderStationList();
        clearForm();
    }

    // 進入編輯模式
    function startEditStation(index) {
        const station = stations[index];
        document.getElementById('stationName').value = station.name;
        document.getElementById('stationUrl').value = station.url;
        document.getElementById('isHls').checked = station.hls;
        document.getElementById('editIndex').value = index;

        document.getElementById('panelTitle').innerText = '🛠 管理面板 (修改電台資料)';
        document.getElementById('saveBtn').innerText = '💾 儲存修改內容';
        document.getElementById('cancelEditBtn').style.display = 'block';
    }

    // 取消編輯模式
    function cancelEdit() {
        clearForm();
        document.getElementById('editIndex').value = '-1';
        document.getElementById('panelTitle').innerText = '🛠 管理面板 (新增自訂串流)';
        document.getElementById('saveBtn').innerText = '➕ 新增此電臺';
        document.getElementById('cancelEditBtn').style.display = 'none';
    }

    // 刪除電台
    function deleteStation(index) {
        if (confirm(`確定要刪除「${stations[index].name}」這個電台嗎？`)) {
            stations.splice(index, 1);
            localStorage.setItem('radio_stations', JSON.stringify(stations));
            renderStationDropdown();
            renderStationList();
            cancelEdit();
        }
    }

    // 清空表單
    function clearForm() {
        document.getElementById('stationName').value = '';
        document.getElementById('stationUrl').value = '';
        document.getElementById('isHls').checked = false;
    }

    // 播放選擇的電臺
    function playStation() {
        const select = document.getElementById('stationSelect');
        const selectedOption = select.options[select.selectedIndex];
        const url = select.value;
        
        const audio = document.getElementById('audioPlayer');

        if (!url) {
            audio.pause();
            updateMarquee("歡迎來到 Roy 的廣播電臺，請選擇電臺開始收聽...");
            stopTitleMarquee();
            document.title = "Roy's 雲端網路廣播播放器";
            return;
        }

        const isHlsStr = selectedOption.getAttribute('data-hls');
        const stationName = selectedOption.text;

        // 更新文字內容
        const playText = `正在播放：${stationName} 🎵 串流網址: ${url} `;
        updateMarquee(playText);
        startTitleMarquee(playText);

        // 處理 HLS 串流與一般音訊
        if (hlsPlayer) {
            hlsPlayer.destroy();
            hlsPlayer = null;
        }

        if (isHlsStr === 'true') {
            if (Hls.isSupported()) {
                hlsPlayer = new Hls();
                hlsPlayer.loadSource(url);
                hlsPlayer.attachMedia(audio);
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function() {
                    audio.play();
                });
            } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                audio.src = url;
                audio.play();
            } else {
                alert('您的瀏覽器不支援 HLS 播放');
            }
        } else {
            audio.src = url;
            audio.play();
        }
    }

    // 更新網頁內跑馬燈
    function updateMarquee(text) {
        document.getElementById('marqueeText').innerText = text;
    }

    // 啟動瀏覽器標題跑馬燈
    function startTitleMarquee(text) {
        stopTitleMarquee();
        let displayCtx = text + "   ";
        titleInterval = setInterval(() => {
            displayCtx = displayCtx.substring(1) + displayCtx.substring(0, 1);
            document.title = displayCtx;
        }, 400); // 每 0.4 秒滾動一次
    }

    // 停止瀏覽器標題跑馬燈
    function stopTitleMarquee() {
        if (titleInterval) {
            clearInterval(titleInterval);
            titleInterval = null;
        }
    }
</script>

</body>
</html>
