<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roy's 雲端網路廣播播放器</title>
    <!-- 引入 Google 官方安全維護的 Firebase SDK v9 相容版本 -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <!-- 引入 HLS.js 用於解碼播放警廣等 .m3u8 直播源 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.8)), 
                        url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background 0.5s ease;
            overflow-x: hidden;
        }
        /* 會員驗證卡片 */
        .auth-container {
            background: rgba(20, 24, 35, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            color: #fff;
        }
        .auth-container h2 {
            margin-top: 0;
            font-size: 26px;
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
            letter-spacing: 1px;
        }
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #b3b3b3;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }
        .input-group input:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.3);
        }
        .auth-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .auth-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.4);
        }
        .auth-links {
            margin-top: 20px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }
        .auth-links a {
            color: #00ffcc;
            text-decoration: none;
            cursor: pointer;
        }
        .auth-links a:hover { text-decoration: underline; }
        
        /* 主播放器介面 */
        .player-container {
            display: none;
            background: rgba(15, 20, 30, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            max-width: 480px;
            color: #fff;
        }
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }
        .player-header h2 {
            margin: 0;
            font-size: 22px;
            background: linear-gradient(45deg, #00d2ff, #00a8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logout-link {
            color: #ff4d4d;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
        }
        
        /* 🌟 頂端正上方播放串流名稱「跑馬燈提示框」 */
        .top-station-banner {
            margin: 20px 0;
            padding: 15px;
            background: rgba(0, 210, 255, 0.06);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 8px;
            white-space: nowrap;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0, 210, 255, 0.1);
        }
        .top-marquee-text {
            display: inline-block;
            font-weight: bold;
            font-size: 16px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
            padding-left: 100%;
            animation: top-marquee-animation 15s linear infinite;
        }
        @keyframes top-marquee-animation {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
        
        audio {
            width: 100%;
            margin-bottom: 20px;
            filter: invert(0.9) hue-rotate(180deg);
        }
        .section-title {
            font-size: 13px;
            color: #8a99ad;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 25px 0 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 5px;
        }
        .station-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            max-height: 180px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        .station-list::-webkit-scrollbar, .admin-panel::-webkit-scrollbar {
            width: 6px;
        }
        .station-list::-webkit-scrollbar-thumb, .admin-panel::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }
        .station-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 2px 10px;
        }
        .station-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #e0e6ed;
            padding: 12px 0;
            font-size: 15px;
            cursor: pointer;
            text-align: left;
            font-weight: 500;
            outline: none;
        }
        .station-item.active {
            background: linear-gradient(90deg, rgba(0, 210, 255, 0.2), transparent);
            border-color: rgba(0, 210, 255, 0.4);
        }
        .station-item.active .station-btn { color: #00d2ff; }
        .delete-btn {
            background: transparent;
            border: none;
            color: #ff4d4d;
            font-size: 16px;
            cursor: pointer;
            padding: 8px;
            opacity: 0.6;
        }
        .delete-btn:hover { opacity: 1; }
        
        .admin-panel {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
        }
        .form-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .form-row input[type="text"] {
            width: 100%; padding: 10px 12px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px; color: white; font-size: 13px; outline: none;
        }
        .checkbox-row { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #b3b3b3; margin-bottom: 10px; }
        .action-btn { width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .add-btn { background: #00b894; color: white; margin-bottom: 12px; }
        .bg-controls { display: flex; gap: 10px; }
        .bg-btn { flex: 1; background: #6c5ce7; color: white; }
        #file-input { display: none; }
    </style>
</head>
<body>

<!-- 面板 1：登入系統 -->
<div class="auth-container" id="login-panel">
    <h2>Roy's Radio 登入</h2>
    <div style="margin-bottom: 25px; color:#aaa; font-size:14px;">請輸入您的雲端帳密以存取電臺</div>
    <div class="input-group">
        <label>電子郵件 (Email)</label>
        <input type="text" id="login-email" placeholder="請輸入註冊信箱（如：roy@example.com）">
    </div>
    <div class="input-group">
        <label>安全密碼</label>
        <input type="password" id="login-pass" placeholder="請輸入密碼">
    </div>
    <button class="auth-btn" onclick="handleLogin()">驗證並登入</button>
    <div class="auth-links">
        <a onclick="switchPanel('forgot')">忘記/修改密碼？</a>
        <a onclick="switchPanel('register')">申請註冊新帳號</a>
    </div>
</div>

<!-- 面板 2：註冊帳號 -->
<div class="auth-container" id="register-panel" style="display: none;">
    <h2>申請新帳號</h2>
    <div style="margin-bottom: 25px; color:#aaa; font-size:14px;">註冊成功後即可立即登入使用</div>
    <div class="input-group">
        <label>設定電子郵件 (Email)</label>
        <input type="text" id="reg-email" placeholder="請輸入您的真實信箱">
    </div>
    <div class="input-group">
        <label>設定安全密碼 (至少6碼)</label>
        <input type="password" id="reg-pass" placeholder="請建立登入密碼">
    </div>
    <button class="auth-btn" onclick="handleRegister()">提交申請並登入</button>
    <div class="auth-links" style="justify-content: center;">
        <a onclick="switchPanel('login')">返回登入系統</a>
    </div>
</div>

<!-- 面板 3：忘記密碼 -->
<div class="auth-container" id="forgot-panel" style="display: none;">
    <h2>重設與修改密碼</h2>
    <div style="margin-bottom: 25px; color:#aaa; font-size:14px;">送出後系統會發送重設密碼的 MAIL 驗證信</div>
    <div class="input-group">
        <label>您的電子郵件 (Email)</label>
        <input type="text" id="forgot-email" placeholder="請輸入您綁定的註冊信箱">
    </div>
    <button class="auth-btn" onclick="handleForgotPassword()">發送重設密碼信件</button>
    <div class="auth-links" style="justify-content: center;">
        <a onclick="switchPanel('login')">返回登入系統</a>
    </div>
</div>

<!-- 面板 4：主播放器頁面 -->
<div class="player-container" id="player-panel">
    <div class="player-header">
        <h2>🌌 Roy 的廣播電臺</h2>
        <a class="logout-link" onclick="handleLogout()">登出電臺</a>
    </div>
    
    <!-- 🌟 頂端正上方播放串流名稱「跑馬燈提示框」 -->
    <div class="top-station-banner">
        <div class="top-marquee-text" id="current-title">請選擇下方電臺或自訂新增串流...</div>
    </div>
    
    <audio id="radio-player" controls></audio>

    <div class="section-title">📻 收聽清單</div>
    <div class="station-list" id="station-list-box"></div>

    <div class="section-title">🛠️ 管理面板</div>
    <div class="admin-panel">
        <div class="form-row">
            <input type="text" id="new-name" placeholder="電臺名稱（例：中廣流行網）">
        </div>
        <div class="form-row">
            <input type="text" id="new-url" placeholder="串流網址 (https://...)">
        </div>
        <div class="checkbox-row">
            <input type="checkbox" id="new-ishls">
            <label for="new-ishls">這是 HLS 串流 (警廣等 .m3u8 格式請勾選)</label>
        </div>
        <button class="action-btn add-btn" onclick="addNewStation()">➕ 新增此電臺</button>
        
        <div class="bg-controls">
            <button class="action-btn bg-btn" onclick="changeBgUrl()">🖼️ 貼網址換背景</button>
            <button class="action-btn bg-btn" onclick="document.getElementById('file-input').click()">📁 上傳背景圖</button>
            <input type="file" id="file-input" accept="image/*" onchange="changeBgFile(event)">
        </div>
    </div>
</div>

<script>
    // ========================================================
    // 🔑 請直接把您在 Firebase 申請的金鑰貼在下面引號內：
    // ========================================================
    const firebaseConfig = {
        apiKey: "AIzaSyBfrd-K31m36eQIHx3s_f5mN5LtWpSf-bA",
  authDomain: "roy-radio.firebaseapp.com",
  projectId: "roy-radio",
  storageBucket: "roy-radio.firebasestorage.app",
  messagingSenderId: "15329601327",
  appId: "1:15329601327:web:d3036a3c5d8b6091e823da"
    };
    // ========================================================

    // 初始化 Firebase Auth
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const defaultStations = [
        { name: "🟢 警廣台中分臺 (TCS)", url: "https://stream.pbs.gov.tw/live/TCS/playlist.m3u8", isHls: true },
        { name: "🔵 中廣流行網", url: "https://sonnykuo.appspot.com/bcc/?id=中廣流行網", isHls: false },
        { name: "🔵 中廣新聞網", url: "https://sonnykuo.appspot.com/bcc/?id=中廣新聞網", isHls: false },
        { name: "🔵 中廣音樂網", url: "https://sonnykuo.appspot.com/bcc/?id=中廣音樂網", isHls: false },
        { name: "🟠 飛碟聯播網", url: "https://stream.rcs.revma.com/em90w4aeewzuv.m4a", isHls: false },
        { name: "🔴 全國廣播 M-Radio", url: "https://stream.rcs.revma.com/044q61ha7a0uv", isHls: false }
    ];

    let stations = [];
    const audio = document.getElementById('radio-player');
    const titleDiv = document.getElementById('current-title');
    let hls = null;

    // 實時監聽會員登入狀態
    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('login-panel').style.display = 'none';
            document.getElementById('register-panel').style.display = 'none';
            document.getElementById('forgot-panel').style.display = 'none';
            document.getElementById('player-panel').style.display = 'block';
            initPlayer();
        } else {
            document.getElementById('player-panel').style.display = 'none';
            document.getElementById('login-panel').style.display = 'block';
            audio.src = '';
        }
    });

    function switchPanel(panel) {
        document.getElementById('login-panel').style.display = panel === 'login' ? 'block' : 'none';
        document.getElementById('register-panel').style.display = panel === 'register' ? 'block' : 'none';
        document.getElementById('forgot-panel').style.display = panel === 'forgot' ? 'block' : 'none';
    }

    function handleLogin() {
        const email = document.getElementById('login-email').value.trim();
        const pass = document.getElementById('login-pass').value;
        if(!email || !pass) return alert('請完整輸入 Email 與密碼');
        auth.signInWithEmailAndPassword(email, pass).catch(err => alert('登入失敗: ' + err.message));
    }

    function handleRegister() {
        const email = document.getElementById('reg-email').value.trim();
        const pass = document.getElementById('reg-pass').value;
        if(!email || !pass) return alert('請填寫完整註冊資訊');
        auth.createUserWithEmailAndPassword(email, pass)
            .then(() => alert('帳號申請成功，系統已為您自動登入！'))
            .catch(err => alert('申請失敗: ' + err.message));
    }

    function handleForgotPassword() {
        const email = document.getElementById('forgot-email').value.trim();
        if(!email) return alert('請輸入您的註冊電子郵件');
        auth.sendPasswordResetEmail(email)
            .then(() => {
                alert('重設密碼信件已發送！請至您的 Email 查看重設連結。');
                switchPanel('login');
            })
            .catch(err => alert('發送失敗: ' + err.message));
    }

    function handleLogout() { auth.signOut(); }

    function initPlayer() {
        const savedBg = localStorage.getItem('roy_radio_bg');
        if (savedBg) document.body.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.8)), url('${savedBg}')`;

        const savedStations = localStorage.getItem('roy_radio_stations');
        stations = savedStations ? JSON.parse(savedStations) : [...defaultStations];
        renderStations();
    }

    function renderStations() {
        const box = document.getElementById('station-list-box');
        box.innerHTML = '';
        stations.forEach((st, index) => {
            const item = document.createElement('div');
            item.className = 'station-item';
            
            const btn = document.createElement('button');
            btn.className = 'station-btn';
            btn.textContent = st.name;
            btn.onclick = () => playStation(st.name, st.url, item, st.isHls);
            
            const del = document.createElement('button');
            del.className = 'delete-btn';
            del.innerHTML = '🗑️';
            del.onclick = (e) => { e.stopPropagation(); deleteStation(index); };
            
            item.appendChild(btn);
            item.appendChild(del);
            box.appendChild(item);
        });
    }

    function playStation(name, url, element, isHls) {
        document.querySelectorAll('.station-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        
        // 🌟 讓頂端正上方的電臺名稱跑馬燈重置並開始持續滾動
        titleDiv.textContent = `🎵 目前正在收聽頻道：【${name}】  •••••  直播源網址：[ ${url} ]  •••••  祝您聆聽愉快！  •••••  `;
        
        // 重新觸發跑馬燈動畫以確保排版正確
        titleDiv.style.animation = 'none';
        titleDiv.offsetHeight; // 觸發重繪
        titleDiv.style.animation = 'top-marquee-animation 18s linear infinite';

        if (hls) { hls.destroy(); hls = null; }

        if (isHls) {
            if (Hls.isSupported()) {
                hls = new Hls({ maxMaxBufferLength: 10 });
                hls.loadSource(url);
                hls.attachMedia(audio);
                hls.on(Hls.Events.MANIFEST_PARSED, () => audio.play().catch(() => {}));
            } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                audio.src = url;
                audio.addEventListener('loadedmetadata', () => audio.play().catch(() => {}));
            }
        } else {
            audio.src = url;
            audio.load();
            audio.play().catch(() => {});
        }
    }

    function addNewStation() {
        const nameInput = document.getElementById('new-name');
        const urlInput = document.getElementById('new-url');
        const isHlsCheck = document.getElementById('new-ishls');
        if (!nameInput.value.trim() || !urlInput.value.trim()) return alert('請填寫完整資訊');

        stations.push({ name: nameInput.value.trim(), url: urlInput.value.trim(), isHls: isHlsCheck.checked });
        localStorage.setItem('roy_radio_stations', JSON.stringify(stations));
        renderStations();
        nameInput.value = ''; urlInput.value = ''; isHlsCheck.checked = false;
    }

    function deleteStation(index) {
        if (confirm(`確定要刪除「${stations[index].name}」嗎？`)) {
            stations.splice(index, 1);
            localStorage.setItem('roy_radio_stations', JSON.stringify(stations));
            renderStations();
        }
    }

    function changeBgUrl() {
        const url = prompt('請輸入網路圖片 URL 網址：');
        if (url && url.trim() !== '') {
            document.body.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.8)), url('${url}')`;
            localStorage.setItem('roy_radio_bg', url);
        }
    }

    function changeBgFile(event) {
        const file = event.target.files;
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Url = e.target.result;
                document.body.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.8)), url('${base64Url}')`;
                try { localStorage.setItem('roy_radio_bg', base64Url); } catch (e) { alert('本地圖片檔案較大，建議使用小於 1MB 圖片或直接貼上網路圖片網址。'); }
            };
            reader.readAsDataURL(file);
        }
    }
</script>
</body>
</html>
