<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Roy's Radio" />
  <meta name="theme-color" content="#070b14" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon-512.png" />
  <title>Roy的網路廣播播放器 // CYBER HUD v3.0</title>

  <script>
    (function() {
      var base = "https:" + "//cdn.jsdelivr.net/npm/";
      var libs = [
        base + "hls.js@1.5.15/dist/hls.min.js",
        base + "firebase@10.12.2/firebase-app-compat.js",
        base + "firebase@10.12.2/firebase-auth-compat.js",
        base + "firebase@10.12.2/firebase-firestore-compat.js"
      ];
      function loadNext(i) {
        if (i >= libs.length) {
          if (typeof initFirebaseSafe === 'function') initFirebaseSafe();
          return;
        }
        var s = document.createElement('script');
        s.src = libs[i];
        s.onload = function() { loadNext(i + 1); };
        s.onerror = function() { loadNext(i + 1); };
        document.head.appendChild(s);
      }
      loadNext(0);
    })();
  </script>

  <style>
    :root {
      --bg-dark: #070b14;
      --panel-bg: rgba(13, 21, 38, 0.88);
      --border-glow: #00f3ff;
      --accent-pink: #ff007f;
      --accent-green: #00ff9d;
      --accent-yellow: #ffd000;
      --text-main: #e2f1f8;
      --text-dim: #7f9eb2;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", monospace;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom)) 20px;
      background: radial-gradient(circle at top, #101d36 0%, var(--bg-dark) 80%);
      color: var(--text-main);
      min-height: 100vh;
      touch-action: manipulation;
    }

    .hidden { display: none !important; }
    .container { max-width: 900px; margin: 0 auto; }

    .hud-box {
      background: var(--panel-bg);
      border: 1px solid rgba(0, 243, 255, 0.35);
      box-shadow: 0 0 18px rgba(0, 243, 255, 0.12), inset 0 0 12px rgba(0, 243, 255, 0.05);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 18px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    h1, h2, h3 { margin-top: 0; letter-spacing: 1px; }
    h1 { color: var(--border-glow); text-shadow: 0 0 10px rgba(0, 243, 255, 0.6); font-size: 1.55rem; margin-bottom: 4px; }
    h2 { font-size: 1.15rem; color: #8be9fd; border-bottom: 1px solid rgba(0, 243, 255, 0.2); padding-bottom: 8px; }
    h3 { font-size: 1.02rem; color: #8be9fd; margin-top: 20px; margin-bottom: 8px; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .clock { color: var(--accent-green); font-weight: bold; font-size: 0.92rem; }
    .status-panel {
      background: rgba(0, 0, 0, 0.5);
      border-left: 4px solid var(--border-glow);
      padding: 12px 15px;
      border-radius: 4px;
      margin-bottom: 12px;
    }
    .status-badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 0.85rem; font-weight: bold; margin-right: 8px;
      background: rgba(0, 243, 255, 0.15); color: var(--border-glow);
    }
    .status-badge.warn { background: rgba(255, 208, 0, 0.2); color: var(--accent-yellow); }
    .status-badge.err { background: rgba(255, 0, 127, 0.2); color: var(--accent-pink); }
    .status-badge.ok { background: rgba(0, 255, 157, 0.2); color: var(--accent-green); }

    #nowPlayingTitle {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(180deg, #ffffff 15%, #38b6ff 65%, #0066ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.95));
      vertical-align: middle;
      line-height: 1.3;
      display: inline-block;
    }
    .icy-marquee {
      margin-top: 8px; font-size: 0.92rem; color: var(--accent-yellow);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .visualizer-wrap {
      background: rgba(4, 9, 18, 0.75);
      border: 1px solid rgba(0, 243, 255, 0.25);
      border-radius: 6px;
      padding: 6px;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
    }
    #visualizerCanvas { width: 100%; height: 54px; display: block; }
    .vis-tag {
      position: absolute; top: 4px; right: 8px;
      font-size: 0.7rem; color: rgba(0, 243, 255, 0.55); pointer-events: none;
    }

    input, select {
      width: 100%; padding: 9px 12px; margin: 5px 0 10px;
      background: rgba(5, 10, 20, 0.85); border: 1px solid rgba(0, 243, 255, 0.4);
      color: var(--text-main); border-radius: 4px; outline: none;
    }
    input:focus, select:focus { border-color: var(--border-glow); box-shadow: 0 0 8px rgba(0, 243, 255, 0.4); }

    button {
      background: rgba(0, 243, 255, 0.15);
      border: 1px solid var(--border-glow);
      color: var(--border-glow);
      padding: 8px 13px; border-radius: 4px; cursor: pointer;
      font-weight: bold; transition: all 0.2s; font-size: 0.9rem;
    }
    button:hover { background: var(--border-glow); color: #050a14; box-shadow: 0 0 12px var(--border-glow); }
    button.btn-pink { border-color: var(--accent-pink); color: var(--accent-pink); background: rgba(255, 0, 127, 0.12); }
    button.btn-pink:hover { background: var(--accent-pink); color: #fff; box-shadow: 0 0 12px var(--accent-pink); }
    button.btn-green { border-color: var(--accent-green); color: var(--accent-green); background: rgba(0, 255, 157, 0.12); }
    button.btn-green:hover { background: var(--accent-green); color: #050a14; }
    button.btn-yellow { border-color: var(--accent-yellow); color: var(--accent-yellow); background: rgba(255, 208, 0, 0.12); }
    button.btn-yellow:hover { background: var(--accent-yellow); color: #050a14; }
    button.recording { animation: pulse 1.2s infinite; background: var(--accent-pink); color: #fff; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.55; } 100% { opacity: 1; } }

    .controls-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
    .volume-box { display: flex; align-items: center; gap: 6px; margin-left: auto; }
    .volume-box input[type="range"] { width: 95px; margin: 0; }

    .filter-toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    .filter-toolbar input { flex: 2; min-width: 180px; margin: 0; }
    .filter-toolbar select { flex: 1; min-width: 130px; margin: 0; }

    .tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .tab-btn.active { background: var(--border-glow); color: #050a14; }

    .station-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.08); gap: 8px;
    }
    .station-item:hover { background: rgba(0, 243, 255, 0.06); }
    .cat-tag {
      display: inline-block; font-size: 0.72rem; padding: 1px 6px;
      border-radius: 3px; background: rgba(0, 243, 255, 0.15); color: #8be9fd; margin-left: 6px;
    }

    .collapsible-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
    .collapsible-content { display: none; margin-top: 15px; }
    .collapsible-content.open { display: block; }

    .profile-card {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(0, 243, 255, 0.25);
      border-radius: 6px; padding: 14px; margin-top: 10px;
    }
    .profile-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    .profile-row input { margin: 0; flex: 1; }
    .profile-row button { white-space: nowrap; }
    .field-label { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 4px; display: block; }

    .rec-vault { margin-top: 14px; padding-top: 12px; border-top: 1px dashed rgba(255, 0, 127, 0.4); }
    .rec-item {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 8px; background: rgba(0,0,0,0.4); padding: 8px 10px; border-radius: 6px; margin-bottom: 8px;
    }
    .rec-item audio { height: 32px; max-width: 240px; }

    .shortcut-hint { font-size: 0.78rem; color: var(--text-dim); margin-top: 12px; line-height: 1.5; }
    .modal-close-bar {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(0, 243, 255, 0.25); padding-bottom: 10px; margin-bottom: 14px;
    }

    .custom-modal-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
      z-index: 99999; align-items: center; justify-content: center; padding: 16px;
    }
    .custom-modal-backdrop.show { display: flex; }
    .custom-modal-box {
      background: #0b1324; color: var(--text-main);
      border: 1px solid var(--border-glow); border-radius: 10px;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
      max-width: 460px; width: 100%; padding: 22px; max-height: 90vh; overflow-y: auto;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }
    .quick-chip {
      background: rgba(0, 243, 255, 0.08);
      border: 1px solid rgba(0, 243, 255, 0.35);
      color: var(--text-main);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.84rem;
      font-weight: bold;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      transition: all 0.2s;
    }
    .quick-chip.active {
      background: linear-gradient(90deg, rgba(0, 243, 255, 0.28), rgba(0, 255, 157, 0.22));
      border-color: var(--accent-green);
      color: var(--accent-green);
      box-shadow: 0 0 10px rgba(0, 255, 157, 0.35);
    }
    .resume-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 255, 157, 0.12);
      border: 1px solid rgba(0, 255, 157, 0.45);
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 12px;
      font-size: 0.88rem;
      gap: 8px;
    }

    @media (max-width: 600px) {
      body { padding: calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)) 12px; }
      #nowPlayingTitle { font-size: 1.5rem; }
      button { min-height: 42px; }
      input, select { font-size: 16px; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="hud-box top-bar">
    <div>
      <h1>⚡ Roy's Radio player <small style="font-size:0.55em;color:#00ff9d;">// CYBER HUD v3.0</small></h1>
      <div class="clock" id="clockDisplay">📅 載入時間中...</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <span id="currentUserNickname" style="color:var(--accent-green);font-weight:bold;font-size:0.98rem;">👤 本地體驗模式</span>
      <button id="openAuthBtn" class="btn-green" onclick="openAuthModal()">🔐 登入 / 雲端同步</button>
      <button id="logoutBtn" class="btn-pink hidden" onclick="logout()">登出電臺</button>
    </div>
  </div>

  <div id="playerSection">
    <div class="hud-box">
      <!-- 完整播放器主畫面 HTML 結構請參閱來源文件 -->
      <div class="status-panel">
        <div>
          <span id="connBadge" class="status-badge">待機中</span>
          <strong id="nowPlayingTitle">未選擇電臺</strong>
        </div>
        <div class="icy-marquee" id="icyMetadata">🎵 即時節目資訊 (ICY)：等待串流連線...</div>
      </div>
      <!-- 略過部分中間 UI 控制項標籤與選單 -->
      <div class="controls-row">
        <button type="button" onclick="prevStation()">⏮ 上一台</button>
        <button type="button" id="playPauseBtn" onclick="togglePlay()">▶ 播放</button>
        <button type="button" onclick="nextStation()">⏭ 下一台</button>
        <button type="button" id="favToggleBtn" onclick="toggleCurrentFav()">☆ 收藏</button>
        <button type="button" id="recordBtn" class="btn-pink" onclick="toggleRecording()">⏺ 開始錄音</button>
      </div>
      <div class="shortcut-hint">⌨️ 快捷鍵：<code>Space</code> 播放/暫停 ｜ <code>←/→</code> 上/下一台 ｜ <code>↑/↓</code> 音量 ｜ <code>M</code> 靜音 ｜ <code>R</code> 錄音</div>
      <audio id="audioPlayer" playsinline webkit-playsinline crossorigin="anonymous"></audio>
    </div>
</div>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBfrd-K31m36eQIHx3s_f5mN5LtWpSf-bA",
    authDomain: "://firebaseapp.com",
    projectId: "roy-radio",
    storageBucket: "roy-radio.firebasestorage.app",
    messagingSenderId: "15329601327",
    appId: "1:15329601327:web:d3036a3c5d8b6091e823da",
    measurementId: "G-2N69W5VK65"
  };

  let auth = null;
  let db = null;
  function initFirebaseSafe() {
    if (!window.firebase || typeof firebase.auth !== 'function' || typeof firebase.firestore !== 'function') {
      return false;
    }
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    if (!auth) {
      auth = firebase.auth();
      db = firebase.firestore();
      auth.onAuthStateChanged(async (user) => {
        if (user) {
          currentUser = user;
          closeAuthModal();
          updateHeaderNicknameUI();
          await loadUserDataFromCloud(user.uid);
        } else {
          currentUser = null;
          userProfile = { customId: '', nickname: '', email: '' };
          updateHeaderNicknameUI();
          loadLocalData();
        }
      });
    }
    return true;
  }
  const fbBootTimer = setInterval(() => {
    if (initFirebaseSafe()) clearInterval(fbBootTimer);
  }, 500);

  const _H = "https:" + "//";
  const _R = _H + "://revma.com";
  const _P = _H + "stream.pbs.gov.tw/live/";
  const PRESET_STATIONS = [
    { name: "🔵中廣流行網(I like radio)", url: _R + "aw9uqyxy2tzuv", category: "音樂" },
    { name: "中廣新聞網❤️", url: _R + "78fm9wyy2tzuv", category: "新聞交通" },
    { name: "💝中廣音樂網(i Radio)", url: _R + "ndk05tyy2tzuv", category: "音樂" },
    { name: "飛碟聯播網UFO Radio🟠", url: _R + "em90w4aeewzuv.m4a", category: "新聞交通" },
    { name: "🔴全國廣播 M-Radio", url: _R + "044q61ha7a0uv", category: "音樂" },
    { name: "警廣臺中分臺(TCS)💛", url: _P + "TCS/playlist.m3u8", category: "警廣" },
    { name: "❤️警廣全國治安交通網(PBS)", url: _P + "PBS/playlist.m3u8", category: "警廣" }
  ];

  let currentUser = null;
  let userProfile = { customId: '', nickname: '', email: '' };
  let stations = [];
  let favorites = [];
  let playHistory = [];
  let currentFilter = 'all';
  let currentStationIndex = -1;
  let hls = null;

  let retryCount = 0;
  const MAX_RETRIES = 5;
  let retryTimer = null;
  let isUserPaused = true;
  let stallDebounceTimer = null;

  let mediaRecorder = null;
  let recordedChunks = [];
  let recInterval = null;
  let recSeconds = 0;
  let savedRecordings = [];
  let recWakeLock = null;

  let sleepTimerId = null;
  let sleepRemainingSec = 0;

  let icyTimer = null;
  let titleMarqueeTimer = null;
  const DEFAULT_PAGE_TITLE = "Roy's 雲端網路廣播播放器 // CYBER HUD v3.0";
  const audio = document.getElementById('audioPlayer');
  let audioCtx = null, analyser = null, recDestNode = null, visDataArray = null, isVisSimulated = false, visInitialized = false;
  function initVisualizer() {
    if (visInitialized) {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return;
    }
    visInitialized = true;
    const canvas = document.getElementById('visualizerCanvas');
    const ctx = canvas.getContext('2d');
    const tag = document.getElementById('visModeTag');

    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaElementSource(audio);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 64;

      // 建立跨平台（含 iOS）通用的錄音分流節點
      recDestNode = audioCtx.createMediaStreamDestination();
      source.connect(recDestNode);

      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      visDataArray = new Uint8Array(analyser.frequencyBinCount);
      tag.textContent = "HUD SPECTRUM // REAL-TIME";
    } catch (e) {
      isVisSimulated = true;
      tag.textContent = "HUD SPECTRUM // SIMULATED";
    }

    function drawSpectrum() {
      requestAnimationFrame(drawSpectrum);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const barCount = 32;
      const barWidth = (canvas.width / barCount) - 4;
      let hasSignal = false;

      if (!isVisSimulated && analyser && !audio.paused) {
        analyser.getByteFrequencyData(visDataArray);
        for (let j = 0; j < barCount; j++) { if (visDataArray[j] > 0) { hasSignal = true; break; } }
      }

      for (let i = 0; i < barCount; i++) {
        let val = 4;
        if (!audio.paused) {
          if (!isVisSimulated && hasSignal) val = visDataArray[i] || 6;
          else val = Math.abs(Math.sin(Date.now() * 0.005 + i * 0.45)) * 130 + Math.random() * 65 + 15;
        }
        const barH = Math.max(3, (val / 255) * canvas.height);
        const grad = ctx.createLinearGradient(0, canvas.height - barH, 0, canvas.height);
        grad.addColorStop(0, '#00ff9d');
        grad.addColorStop(1, '#00f3ff');
        ctx.fillStyle = grad;
        ctx.fillRect(i * (barWidth + 4), canvas.height - barH, barWidth, barH);
      }
    }
    drawSpectrum();
  }

  function startTitleMarquee(displayText) {
    stopTitleMarquee();
    let marqueeText = `▶ 正在收聽：${displayText} ｜ Roy's Net Radio 📻 　　`;
    titleMarqueeTimer = setInterval(() => {
      marqueeText = marqueeText.slice(1) + marqueeText[0];
      if (!document.hidden) document.title = marqueeText;
    }, 300);
  }

  function stopTitleMarquee(statusPrefix = "") {
    clearInterval(titleMarqueeTimer);
    titleMarqueeTimer = null;
    document.title = statusPrefix ? `${statusPrefix} ${DEFAULT_PAGE_TITLE}` : DEFAULT_PAGE_TITLE;
  }

  setInterval(() => {
    const now = new Date();
    document.getElementById('clockDisplay').textContent = `📅 ${now.toLocaleString('zh-TW', { hour12: false })}`;
  }, 1000);
  function openAuthModal() { document.getElementById('authModal').classList.add('show'); }
  function closeAuthModal() { document.getElementById('authModal').classList.remove('show'); }
  function switchAuthView(boxId) {
    ['loginBox', 'registerBox', 'resetBox'].forEach(id => document.getElementById(id).classList.add('hidden'));
    document.getElementById(boxId).classList.remove('hidden');
  }

  function updateHeaderNicknameUI() {
    const el = document.getElementById('currentUserNickname');
    const openBtn = document.getElementById('openAuthBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    if (!currentUser) {
      el.textContent = '👤 本地體驗模式';
      openBtn.classList.remove('hidden');
      logoutBtn.classList.add('hidden');
      return;
    }
    openBtn.classList.add('hidden');
    logoutBtn.classList.remove('hidden');
    if (currentUser.isAnonymous) {
      el.textContent = '👤 訪客雲端模式';
      return;
    }
    const fallbackName = userProfile.nickname || userProfile.customId || (currentUser.email ? currentUser.email.split('@') : '聽眾');
    el.textContent = `👤 ${fallbackName}`;
  }

  function loadLocalData() {
    const localStations = JSON.parse(localStorage.getItem('roy_stations'));
    stations = (localStations && localStations.length > 0) ? localStations : [...PRESET_STATIONS];
    favorites = JSON.parse(localStorage.getItem('roy_favs')) || [];
    playHistory = JSON.parse(localStorage.getItem('roy_history')) || [];
    renderAllLists();
  }

  async function login() {
    if (!initFirebaseSafe()) return alert('雲端系統載入中，請稍候 2 秒再試！');
    const rawAccount = document.getElementById('loginAccount').value.trim();
    const pass = document.getElementById('loginPass').value;
    if (!rawAccount || !pass) return alert('請輸入專屬 ID 或 Email 與密碼');
    try {
      let targetEmail = rawAccount.toLowerCase();
      if (!targetEmail.includes('@')) {
        const idSnap = await db.collection('user_ids').doc(targetEmail).get();
        targetEmail = (idSnap.exists && idSnap.data().email) ? idSnap.data().email : `${targetEmail}@royradio.local`;
      }
      await auth.signInWithEmailAndPassword(targetEmail, pass);
    } catch (err) {
      alert('登入失敗：請確認帳號/Email 與密碼是否正確。\n(' + err.message + ')');
    }
  }

  async function quickDemoLogin() {
    if (!initFirebaseSafe()) return alert('雲端系統載入中，請稍候 2 秒再試！');
    try {
      await auth.signInAnonymously();
    } catch (err) {
      alert('雲端試用啟動失敗：\n' + err.message);
    }
  }

  async function register() {
    if (!initFirebaseSafe()) return alert('雲端系統載入中，請稍候 2 秒再試！');
    const email = document.getElementById('regEmail').value.trim().toLowerCase();
    const customId = document.getElementById('regCustomId').value.trim().toLowerCase();
    const rawNickname = document.getElementById('regNickname').value.trim();
    const pass = document.getElementById('regPass').value;

    if (!email || !email.includes('@')) return alert('請輸入有效的電子郵件 (Email)！');
    if (!/^[a-z0-9_]{3,20}$/.test(customId)) return alert('專屬 ID 格式錯誤！請輸入 3～20 碼英文字母、數字或底線 (_)。');
    if (pass.length < 6) return alert('安全密碼至少需 6 碼！');

    const nickname = rawNickname || customId;
    try {
      const idRef = db.collection('user_ids').doc(customId);
      if ((await idRef.get()).exists) return alert(`⚠️ 專屬 ID「${customId}」已被註冊，請更換！`);

      const userCred = await auth.createUserWithEmailAndPassword(email, pass);
      const uid = userCred.user.uid;
      await idRef.set({ uid, email, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      userProfile = { customId, nickname, email };

      await db.collection('users').doc(uid).set({
        email, customId, nickname,
        stations: stations.length ? stations : [...PRESET_STATIONS],
        favorites, playHistory,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });

      updateHeaderNicknameUI();
      alert(`🎉 註冊成功！已綁定 Email 與專屬 ID「${customId}」。`);
    } catch (err) {
      alert('註冊失敗：' + err.message);
    }
  }

  async function resetPassword() {
    if (!initFirebaseSafe()) return alert('雲端系統載入中，請稍候 2 秒再試！');
    const rawAccount = document.getElementById('resetEmail').value.trim();
    if (!rawAccount || !rawAccount.includes('@')) return alert('請輸入完整的電子郵件 (Email)！');

      await auth.sendPasswordResetEmail(rawAccount);
      alert('密碼重設信已寄出至您的信箱！');

      alert('寄送重設信失敗：' + err.message);

  async function reauthenticateUser(currentPass) {
    if (!currentPass) throw new Error('請先在上方輸入「目前密碼」以驗證身分！');
    const credential = firebase.auth.EmailAuthProvider.credential(currentUser.email, currentPass);
    await currentUser.reauthenticateWithCredential(credential);

    const newNick = document.getElementById('profileNicknameInput').value.trim();

  async function updateCustomId() {
    if (!currentUser || currentUser.isAnonymous) return alert('訪客帳號無法設定專屬 ID！');
    const newId = document.getElementById('profileCustomIdInput').value.trim().toLowerCase();
    if (!/^[a-z0-9_]{3,20}$/.test(newId)) return alert('專屬 ID 格式錯誤！請輸入 3～20 碼英文字母、數字或底線。');
    if (newId === userProfile.customId) return alert('新 ID 與目前相同。');
    try {
      const newIdRef = db.collection('user_ids').doc(newId);
      const idSnap = await newIdRef.get();
      if (idSnap.exists && idSnap.data().uid !== currentUser.uid) return alert('⚠️ 此專屬 ID 已被使用！');
      await newIdRef.set({ uid: currentUser.uid, email: currentUser.email, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      if (userProfile.customId) await db.collection('user_ids').doc(userProfile.customId).delete().catch(() => {});
      await db.collection('users').doc(currentUser.uid).set({ customId: newId, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
      userProfile.customId = newId;
      updateHeaderNicknameUI();
      alert(`🎉 專屬 ID 已更新為「${newId}」！`);
    } catch (err) { alert('更新專屬 ID 失敗：' + err.message); }

  async function updateAccountEmail() {
    if (!currentUser || currentUser.isAnonymous) return alert('訪客帳號無法修改 Email！');
    const currentPass = document.getElementById('currentVerifyPass').value;
    const newEmail = document.getElementById('profileEmailInput').value.trim().toLowerCase();
    if (!newEmail || !newEmail.includes('@')) return alert('請輸入有效的電子郵件格式！');
    try {

      await currentUser.updateEmail(newEmail);
      await db.collection('users').doc(currentUser.uid).set({ email: newEmail, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
      if (userProfile.customId) await db.collection('user_ids').doc(userProfile.customId).set({ uid: currentUser.uid, email: newEmail, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
      userProfile.email = newEmail;
      document.getElementById('currentVerifyPass').value = '';
      alert(`✅ 電子郵件已更新為「${newEmail}」！`);
    } catch (err) { alert('更新 Email 失敗：\n' + err.message); }

  async function updatePassword() {
    if (!currentUser || currentUser.isAnonymous) return alert('訪客帳號無法修改密碼！');
    const currentPass = document.getElementById('currentVerifyPass').value;
    const newPass = document.getElementById('newAccountPass').value;
    if (newPass.length < 6) return alert('新密碼至少需 6 碼！');

      await reauthenticateUser(currentPass);
      await currentUser.updatePassword(newPass);

      document.getElementById('newAccountPass').value = '';

  function logout() { if (auth) auth.signOut(); }

  async function loadUserDataFromCloud(uid) {
    try {
      const docSnap = await db.collection('users').doc(uid).get();
      if (docSnap.exists) {
        const data = docSnap.data();
        const cloudStations = data.stations || [];
        const merged = [...cloudStations];
        stations.forEach(ls => { if (!merged.some(cs => cs.url === ls.url)) merged.push(ls); });
        stations = merged.length ? merged : [...PRESET_STATIONS];
        favorites = Array.from(new Set([...(data.favorites || []), ...favorites]));
        playHistory = data.playHistory || playHistory;

        userProfile.customId = data.customId || '';
        userProfile.nickname = data.nickname || data.customId || '';
        userProfile.email = data.email || currentUser.email || '';

        if (!currentUser.isAnonymous) {
          const nickIn = document.getElementById('profileNicknameInput');
          const idIn = document.getElementById('profileCustomIdInput');
          const mailIn = document.getElementById('profileEmailInput');
          if (nickIn) nickIn.value = userProfile.nickname;
          if (idIn) idIn.value = userProfile.customId;
          if (mailIn) mailIn.value = userProfile.email.endsWith('@royradio.local') ? '' : userProfile.email;
        }
        updateHeaderNicknameUI();
        await saveData();
      } else {
        await saveData();
      }
      renderAllLists();
    } catch (err) {
      console.error('讀取雲端資料失敗:', err);
    }
  }

  async function saveData() {
    localStorage.setItem('roy_stations', JSON.stringify(stations));
    localStorage.setItem('roy_favs', JSON.stringify(favorites));
    localStorage.setItem('roy_history', JSON.stringify(playHistory));
    if (currentUser && db) {
      try {
        await db.collection('users').doc(currentUser.uid).set({
          stations, favorites, playHistory,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });
      } catch (err) { console.error('雲端同步失敗:', err); }
    }
  }
  function setFilter(filter, btnEl) {
    currentFilter = filter;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if (btnEl) btnEl.classList.add('active');

    const selectBox = document.getElementById('selectModeBox');
    const listBox = document.getElementById('listViewBox');

    if (filter === 'all' || filter === 'fav') {
      selectBox.classList.remove('hidden');
      listBox.classList.add('hidden');
      renderDropdown();
    } else {
      selectBox.classList.add('hidden');
      listBox.classList.remove('hidden');
      if (filter === 'history') renderHistory();
      if (filter === 'presets') renderPresets();
    }
  }

  function applySearchFilter() {
    if (currentFilter === 'all' || currentFilter === 'fav') renderDropdown();
    else if (currentFilter === 'history') renderHistory();
    else if (currentFilter === 'presets') renderPresets();
  }

  function matchesSearch(st) {
    const kw = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
    const cat = document.getElementById('categoryFilter')?.value || 'ALL';
    const stCat = st.category || '綜合';
    if (cat !== 'ALL' && stCat !== cat) return false;
    if (kw && !st.name.toLowerCase().includes(kw) && !stCat.toLowerCase().includes(kw)) return false;
    return true;
  }

  function renderDropdown() {
    const sel = document.getElementById('stationSelect');
    const quickGrid = document.getElementById('quickStationGrid');
    sel.innerHTML = '<option value="">-- 請選擇電臺 --</option>';
    const visibleList = [];

    stations.forEach((st, idx) => {
      const isFav = favorites.includes(st.url);
      if (currentFilter === 'fav' && !isFav) return;
      if (!matchesSearch(st)) return;
      const opt = document.createElement('option');
      opt.value = idx;
      const isHls = st.isHls || st.url.toLowerCase().includes('.m3u8');
      opt.textContent = `${isFav ? '⭐ ' : ''}[${st.category || '綜合'}] ${st.name} ${isHls ? '[HLS]' : ''}`;
      if (idx === currentStationIndex) opt.selected = true;
      sel.appendChild(opt);
      visibleList.push({ st, idx, isFav });
    });

    if (quickGrid) {
      const sorted = [...visibleList].sort((a, b) => (b.isFav ? 1 : 0) - (a.isFav ? 1 : 0)).slice(0, 8);
      quickGrid.innerHTML = sorted.map(item => `
        <div class="quick-chip ${item.idx === currentStationIndex ? 'active' : ''}" onclick="startStream(${item.idx}); toggleQuickGrid();" title="${item.st.name}">
          ${item.isFav ? '⭐' : '📻'} ${item.st.name}
        </div>
      `).join('');
    }
  }

  function renderHistory() {
    const box = document.getElementById('listViewBox');
    const filtered = playHistory.filter(matchesSearch);
    if (filtered.length === 0) {
      box.innerHTML = '<div style="color:var(--text-dim);padding:10px;">無符合的播放紀錄</div>';
      return;
    }
    box.innerHTML = filtered.map(h => `
      <div class="station-item">
        <div>
          <strong>${h.name}</strong>

  function renderPresets() {
    const selectBox = document.getElementById('selectModeBox');
    const box = document.getElementById('listViewBox');
    if (selectBox) selectBox.classList.add('hidden');
    box.classList.remove('hidden');

    const cat = document.getElementById('categoryFilter')?.value || 'ALL';
    const filtered = PRESET_STATIONS
      .map((p, i) => ({ ...p, origIdx: i }))
      .filter(p => cat === 'ALL' || (p.category || '綜合') === cat);

    if (filtered.length === 0) {
      box.innerHTML = '<div style="color:var(--text-dim);padding:10px;">此分類目前無預設電臺，請上方選擇「📂 全部分類」。</div>';

    box.innerHTML = `
      <div style="margin-bottom:8px;text-align:right;">
        <button type="button" class="btn-green" onclick="importAllPresets()">⚡ 一鍵匯入全部預設電臺 (${filtered.length}台)</button>
      </div>
    ` + filtered.map(p => `
      <div class="station-item">
        <div>
          <strong>${p.name}</strong><span class="cat-tag">${p.category || '綜合'}</span>
          <div style="font-size:0.78rem;color:var(--text-dim);word-break:break-all;">${p.url}</div>
        </div>
        <button type="button" onclick="importPreset(${p.origIdx})">➕ 匯入</button>
      </div>

  async function importPreset(idx) {
    const p = PRESET_STATIONS[idx];
    if (stations.some(s => s.url === p.url)) return alert('此電臺已在清單中！');
    stations.push({ ...p });
    await saveData();
    renderAllLists();
    alert(`已匯入：${p.name}`);
  }

  async function importAllPresets() {
    let added = 0;
    PRESET_STATIONS.forEach(p => {
      if (!stations.some(s => s.url === p.url)) { stations.push({ ...p }); added++; }
    });
    await saveData();
    renderAllLists();
    alert(`已成功匯入 ${added} 個新電臺！`);
  }

    if (currentStationIndex < 0) return;
    const st = stations[currentStationIndex];
    const pos = favorites.indexOf(st.url);
    if (pos >= 0) favorites.splice(pos, 1);

    const btn = document.getElementById('favToggleBtn');

    const isFav = favorites.includes(stations[currentStationIndex].url);
    btn.textContent = isFav ? '⭐ 已收藏' : '☆ 收藏';

  async function addToHistory(st) {
    playHistory = playHistory.filter(h => h.url !== st.url);
    playHistory.unshift({ name: st.name, url: st.url, category: st.category || '綜合', time: new Date().toLocaleTimeString('zh-TW', { hour12: false }) });
    if (playHistory.length > 15) playHistory.pop();
    await saveData();

  function playSelectedStation() {
    const idx = document.getElementById('stationSelect').value;
    if (idx !== '') startStream(parseInt(idx, 10));

  function playByUrl(url) {
    const idx = stations.findIndex(s => s.url === url);
    if (idx >= 0) startStream(idx);
    else alert('此電臺已不在清單中');
  }
  function startStream(idx, forceHls = false) {
    clearTimeout(retryTimer);
    retryCount = 0;
    isUserPaused = false;
    currentStationIndex = idx;
    const st = stations[idx];
    initVisualizer();

    document.getElementById('nowPlayingTitle').textContent = st.name;
    setStatus('連線中...', 'warn', '⏳ 載入串流...');
    stopTitleMarquee("⏳ [連線中]");
    updateFavButton();
    renderDropdown();
    addToHistory(st);
    localStorage.setItem('roy_last_station_url', st.url);
    const rb = document.getElementById('resumeBanner');
    if (rb) rb.classList.add('hidden');

    if (hls) { hls.destroy(); hls = null; }
    audio.pause();
    audio.removeAttribute('src');
    audio.load();

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const useHls = forceHls || st.isHls || st.url.toLowerCase().includes('.m3u8');

    // 優先使用 Hls.js（iOS 17+ 支援 ManagedMediaSource，可讓 Web Audio 成功抓到聲音進行錄音）
    if (useHls && typeof Hls !== 'undefined' && Hls.isSupported()) {
      hls = new Hls({ backBufferLength: 15, maxBufferLength: 15, maxMaxBufferLength: 30, enableWorker: true });
      hls.loadSource(st.url);
      hls.attachMedia(audio);
      hls.on(Hls.Events.MANIFEST_PARSED, () => audio.play().catch(handleStreamError));
      hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          if (hls) { hls.destroy(); hls = null; }
          if (isIOS && audio.canPlayType('application/vnd.apple.mpegurl')) {
            audio.src = st.url;
            audio.play().catch(handleStreamError);
          } else {
            handleStreamError();
          }
        }
      });
    } else if (useHls && isIOS && audio.canPlayType('application/vnd.apple.mpegurl')) {
      audio.src = st.url;
      audio.play().catch(handleStreamError);
    } else {
      audio.src = st.url;
      audio.play().catch(() => {
        if (!useHls && typeof Hls !== 'undefined' && Hls.isSupported()) startStream(idx, true);
        else handleStreamError();
      });
    }

    setupMediaSession(st);
    startIcyPolling(st, useHls);
  }

  function setStatus(badgeText, type, spinnerText = '') {
    const badge = document.getElementById('connBadge');
    badge.textContent = badgeText;
    badge.className = `status-badge ${type}`;
    document.getElementById('bufferSpinner').textContent = spinnerText;
  }

  audio.addEventListener('playing', () => {
    clearTimeout(stallDebounceTimer);
    retryCount = 0;
    setStatus('LIVE 直播中', 'ok', '');
    document.getElementById('playPauseBtn').textContent = '⏸ 暫停';
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
    if (currentStationIndex >= 0 && stations[currentStationIndex]) {
      startTitleMarquee(stations[currentStationIndex].name);
      setupMediaSession(stations[currentStationIndex]);
    }
  });
  audio.addEventListener('waiting', () => {
    if (isUserPaused) return;
    clearTimeout(stallDebounceTimer);
    stallDebounceTimer = setTimeout(() => {
      if (!isUserPaused && audio.readyState < 3) setStatus('緩衝中', 'warn', '⏳ 網路緩衝中...');
    }, 1800);
  });
  audio.addEventListener('stalled', () => {
    if (isUserPaused) return;
    clearTimeout(stallDebounceTimer);
    stallDebounceTimer = setTimeout(() => {
      if (!isUserPaused && audio.paused) setStatus('訊號不穩', 'warn', '⚠️ 串流停滯...');
    }, 2000);
  });
  audio.addEventListener('error', () => { if (!isUserPaused) handleStreamError(); });

  window.addEventListener('online', () => {
    if (!isUserPaused && currentStationIndex >= 0 && audio.paused) {
      setStatus('網路已恢復', 'warn', '🔄 正在自動重連電臺...');
      startStream(currentStationIndex);
    }
  });

  function handleStreamError() {
    if (isUserPaused || currentStationIndex < 0) return;
    if (retryCount >= MAX_RETRIES) {
      setStatus('連線失敗', 'err', '❌ 已達最大重連次數，請檢查網址或手動重試');
      stopTitleMarquee("❌ [連線失敗]");
      return;
    }
    retryCount++;
    setStatus('斷線重連中', 'err', `🔄 3秒後進行第 ${retryCount}/${MAX_RETRIES} 次重連...`);
    stopTitleMarquee(`🔄 [重連 ${retryCount}/${MAX_RETRIES}]`);
    clearTimeout(retryTimer);
    retryTimer = setTimeout(() => { if (!isUserPaused) startStream(currentStationIndex); }, 3000);
  }

  function togglePlay() {
    if (currentStationIndex < 0 && stations.length > 0) return startStream(0);
    if (audio.paused) {
      isUserPaused = false;
      initVisualizer();
      audio.play();
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
      document.getElementById('playPauseBtn').textContent = '⏸ 暫停';
    } else {
      isUserPaused = true;
      clearTimeout(retryTimer);
      audio.pause();
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
      setStatus('已暫停', '', '');
      stopTitleMarquee("⏸ [已暫停]");
      document.getElementById('playPauseBtn').textContent = '▶ 播放';
    }
  }

  function prevStation() {
    if (stations.length) startStream((currentStationIndex - 1 + stations.length) % stations.length);
  }
  function nextStation() {

  }
  function changeVolume(val) {

    localStorage.setItem('roy_saved_volume', val);
    document.getElementById('muteBtn').textContent = val == 0 ? '🔇' : '🔊';
  }
  function toggleMute() {

    document.getElementById('muteBtn').textContent = audio.muted ? '🔇' : '🔊';
  }

  function setSleepTimer(minutes) {
    clearInterval(sleepTimerId);
    sleepTimerId = null;
    const badge = document.getElementById('sleepCountdown');
    const mins = parseInt(minutes, 10);
    if (!mins) { badge.textContent = ''; return; }
    sleepRemainingSec = mins * 60;
    updateSleepBadge();
    sleepTimerId = setInterval(() => {
      sleepRemainingSec--;
      if (sleepRemainingSec <= 0) {
        clearInterval(sleepTimerId);
        sleepTimerId = null;
        badge.textContent = '💤 已自動停止';
        if (!audio.paused) togglePlay();
        document.getElementById('sleepSelect').value = '0';
      } else {
        updateSleepBadge();
      }
    }, 1000);
  }
  function updateSleepBadge() {
    const m = String(Math.floor(sleepRemainingSec / 60)).padStart(2, '0');
    const s = String(sleepRemainingSec % 60).padStart(2, '0');
    document.getElementById('sleepCountdown').textContent = `⏳ ${m}:${s}`;
  }
  function startIcyPolling(st, isHls) {
    if (icyTimer) { clearInterval(icyTimer); icyTimer = null; }
    const icyEl = document.getElementById('icyMetadata');
    if (isHls) { icyEl.textContent = `🎵 HLS 串流直播中：${st.name}`; return; }
    icyEl.textContent = '🎵 正在偵測 ICY 節目曲目資訊...';
    fetchIcyMetadata(st.url);
    icyTimer = setInterval(() => { if (!document.hidden && !audio.paused) fetchIcyMetadata(st.url); }, 15000);
  }
  async function fetchIcyMetadata(url) {
    const icyEl = document.getElementById('icyMetadata');
    try {
      const controller = new AbortController();
      const res = await fetch(url, { headers: { 'Icy-MetaData': '1' }, signal: controller.signal });
      const metaint = parseInt(res.headers.get('icy-metaint'), 10);
      const stationGenre = res.headers.get('icy-genre') || '';
      if (!metaint || !res.body) {
        icyEl.textContent = `🎵 正在收聽直播串流 ${stationGenre ? `(${stationGenre})` : ''}`;
        controller.abort();
        return;
      }
      const reader = res.body.getReader();
      let received = 0, chunks = [];
      while (received < metaint + 512) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
      }
      controller.abort();
      const fullBuf = new Uint8Array(received);
      let offset = 0;
      for (const c of chunks) { fullBuf.set(c, offset); offset += c.length; }
      const metaLen = fullBuf[metaint] * 16;
      if (metaLen > 0) {
        const metaStr = new TextDecoder('utf-8').decode(fullBuf.slice(metaint + 1, metaint + 1 + metaLen));
        const match = metaStr.match(/StreamTitle='([^']*)';/);
        if (match && match[1]) {
          icyEl.textContent = `🎵 正在播放：${match[1]}`;
          if (currentStationIndex >= 0 && stations[currentStationIndex]) {
            startTitleMarquee(`${stations[currentStationIndex].name} - 🎵 ${match[1]}`);
            setupMediaSession(stations[currentStationIndex], match[1]);
          }
          return;
        }
      }
      icyEl.textContent = `🎵 電臺直播中 (無曲目資訊)`;
    } catch (e) {
      icyEl.textContent = `🎵 串流播放中（此電臺未開放跨網域曲目讀取）`;
    }
  }

  function toggleRecording() {
    if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
    else startRecording();
  }

  async function startRecording() {
    if (audio.paused) return alert('請先開始播放電臺再進行錄音！');
    if (typeof MediaRecorder === 'undefined') return alert('此裝置的瀏覽器不支援網頁錄音功能（iOS 請確認為 14.3 以上版本）。');

    // 確保 Web Audio 管線已初始化，且 iOS 處於喚醒狀態
    initVisualizer();
    if (audioCtx && audioCtx.state === 'suspended') {
      await audioCtx.resume();
    }

    try {
      // 優先使用 Web Audio 分流節點（iOS Safari / Chrome 與電腦皆支援）
      const stream = (recDestNode && recDestNode.stream)
        ? recDestNode.stream
        : (audio.captureStream ? audio.captureStream() : (audio.mozCaptureStream ? audio.mozCaptureStream() : null));

      if (!stream) {
        return alert('無法啟動錄音：瀏覽器不支援音訊串流擷取。');
      }

      const mimeTypes = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg'];
      let selectedType = '';
      for (const t of mimeTypes) {
        if (MediaRecorder.isTypeSupported(t)) { selectedType = t; break; }
      }

      recordedChunks = [];
      mediaRecorder = selectedType ? new MediaRecorder(stream, { mimeType: selectedType }) : new MediaRecorder(stream);

      mediaRecorder.ondataavailable = e => {
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const finalMime = mediaRecorder.mimeType || selectedType || (isIOS ? 'audio/mp4' : 'audio/webm');
        const ext = finalMime.includes('mp4') ? 'm4a' : 'webm';

        const blob = new Blob(recordedChunks, { type: finalMime });
        const url = URL.createObjectURL(blob);
        const stName = stations[currentStationIndex]?.name || 'Radio';
        const fileName = `${stName}_${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.${ext}`;

        savedRecordings.unshift({
          name: fileName,
          url,
          blob,
          mimeType: finalMime,
          time: new Date().toLocaleTimeString('zh-TW', { hour12: false })
        });
        renderRecordingVault();
      };

      // 保持手機螢幕微亮，防止 iPhone 鎖屏中斷錄音
      if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').then(wl => { recWakeLock = wl; }).catch(() => {});
      }

      // 傳入 1000ms 確保 iOS 定期寫入音訊區塊，避免記憶體溢出
      mediaRecorder.start(1000);

      const btn = document.getElementById('recordBtn');
      btn.textContent = '⏹ 停止錄音';
      btn.classList.add('recording');
      recSeconds = 0;
      document.getElementById('recTimer').textContent = '00:00';
      recInterval = setInterval(() => {
        recSeconds++;
        document.getElementById('recTimer').textContent = `${String(Math.floor(recSeconds / 60)).padStart(2, '0')}:${String(recSeconds % 60).padStart(2, '0')}`;
      }, 1000);
    } catch (err) {
      alert('無法啟動錄音：此電臺串流伺服器限制了跨網域音訊擷取 (CORS)。\n(' + err.message + ')');
    }
  }

  function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    clearInterval(recInterval);
    if (recWakeLock) {
      recWakeLock.release().catch(() => {});
      recWakeLock = null;
    }
    const btn = document.getElementById('recordBtn');
    btn.textContent = '⏺ 開始錄音';
    btn.classList.remove('recording');
    document.getElementById('recTimer').textContent = '';
  }

  function shareRecording(idx) {
    const rec = savedRecordings[idx];
    if (!rec || !rec.blob) return;
    const file = new File([rec.blob], rec.name, { type: rec.mimeType });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: rec.name }).catch(() => {});
    } else {
      alert('此瀏覽器不支援直接分享，請點擊「⬇ 下載」按鈕儲存檔案。');
    }
  }

  function renderRecordingVault() {
    const vault = document.getElementById('recordingVault');
    const list = document.getElementById('recordingList');
    if (!savedRecordings.length) { vault.classList.add('hidden'); return; }
    vault.classList.remove('hidden');
    const canShareFiles = typeof navigator.canShare === 'function';

    list.innerHTML = savedRecordings.map((rec, i) => `
      <div class="rec-item">
        <div style="flex:1;min-width:160px;">
          <strong style="font-size:0.88rem;">${rec.name}</strong>
          <div style="font-size:0.75rem;color:var(--text-dim);">錄製時間：${rec.time}</div>
        </div>
        <audio controls playsinline src="${rec.url}"></audio>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <a href="${rec.url}" download="${rec.name}"><button class="btn-green" type="button">⬇ 下載</button></a>
          ${canShareFiles ? `<button class="btn-yellow" type="button" onclick="shareRecording(${i})">📤 存到手機</button>` : ''}
          <button class="btn-pink" type="button" onclick="deleteRecording(${i})">🗑</button>
        </div>
      </div>
    `).join('');
  }

  function deleteRecording(idx) {
    URL.revokeObjectURL(savedRecordings[idx].url);
    savedRecordings.splice(idx, 1);
    renderRecordingVault();
  }
  function setupMediaSession(st, songTitle = '') {
    if ('mediaSession' in navigator) {
      const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
      navigator.mediaSession.metadata = null;
      navigator.mediaSession.metadata = new MediaMetadata({
        title: st.name,
        artist: songTitle ? `🎵 ${songTitle}` : "Roy's Net Radio // LIVE",
        album: 'CYBER HUD v3.0',
        artwork: [
          { src: baseUrl + 'icon-512.png', sizes: '512x512', type: 'image/png' }
        ]
      });
      navigator.mediaSession.playbackState = audio.paused ? 'paused' : 'playing';
      navigator.mediaSession.setActionHandler('play', () => { if (audio.paused) togglePlay(); });
      navigator.mediaSession.setActionHandler('pause', () => { if (!audio.paused) togglePlay(); });
      navigator.mediaSession.setActionHandler('previoustrack', prevStation);
      navigator.mediaSession.setActionHandler('nexttrack', nextStation);
    }
  }

  document.addEventListener('keydown', (e) => {
    if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
    if (document.getElementById('authModal').classList.contains('show')) return;
    switch (e.code) {
      case 'Space': e.preventDefault(); togglePlay(); break;
      case 'ArrowLeft': prevStation(); break;
      case 'ArrowRight': nextStation(); break;
      case 'ArrowUp':
        e.preventDefault();
        audio.volume = Math.min(1, +(audio.volume + 0.05).toFixed(2));
        document.getElementById('volumeSlider').value = audio.volume;
        break;
      case 'ArrowDown':
        e.preventDefault();
        audio.volume = Math.max(0, +(audio.volume - 0.05).toFixed(2));
        document.getElementById('volumeSlider').value = audio.volume;
        break;
      case 'KeyM': toggleMute(); break;
      case 'KeyR': toggleRecording(); break;
    }
  });

  function toggleQuickGrid() {
    const grid = document.getElementById('quickStationGrid');
    const btn = document.getElementById('toggleQuickGridBtn');
    if (!grid || !btn) return;
    grid.classList.toggle('hidden');
    const isHidden = grid.classList.contains('hidden');
    btn.textContent = isHidden ? '⚡ 快捷選台牆 ▼' : '⚡ 快捷選台牆 ▲';
  }

  function toggleAdminPanel() {
    const content = document.getElementById('adminPanelContent');
    const arrow = document.getElementById('adminArrow');
    content.classList.toggle('open');
    arrow.textContent = content.classList.contains('open') ? '▲ 收合' : '▼ 展開';
  }

  function renderAllLists() {
    applySearchFilter();
    const manageBox = document.getElementById('manageStationList');
    manageBox.innerHTML = stations.map((st, idx) => {
      const isHls = st.isHls || st.url.toLowerCase().includes('.m3u8');
      return `
      <div class="station-item">
        <div>
          <strong>${st.name}</strong><span class="cat-tag">${st.category || '綜合'}</span> ${isHls ? '<span style="color:var(--accent-green);">[HLS]</span>' : ''}
          <div style="font-size:0.78rem;color:var(--text-dim);word-break:break-all;">${st.url}</div>
        </div>
        <div style="display:flex;gap:6px;">
          <button type="button" onclick="editStation(${idx})">✏️ 編輯</button>
          <button type="button" class="btn-pink" onclick="deleteStation(${idx})">🗑 刪除</button>
        </div>
      </div>`;
    }).join('');
  }

  async function saveStation() {
    const name = document.getElementById('stationName').value.trim();
    const url = document.getElementById('stationUrl').value.trim();
    const category = document.getElementById('stationCategory').value;
    const editIdx = parseInt(document.getElementById('editIndex').value, 10);
    if (!name || !url) return alert('請填寫電臺名稱與串流網址！');

    const item = { name, url, category, isHls: url.toLowerCase().includes('.m3u8') };
    if (editIdx >= 0) stations[editIdx] = item;
    else stations.push(item);

    await saveData();
    cancelEdit();
    renderAllLists();
  }

  function editStation(idx) {
    const st = stations[idx];
    document.getElementById('editIndex').value = idx;
    document.getElementById('stationName').value = st.name;
    document.getElementById('stationUrl').value = st.url;
    document.getElementById('stationCategory').value = st.category || '綜合';
  }

  function cancelEdit() {
    document.getElementById('editIndex').value = '-1';
    document.getElementById('stationName').value = '';
    document.getElementById('stationUrl').value = '';
    document.getElementById('stationCategory').value = '綜合';
  }

  async function deleteStation(idx) {
    if (!confirm(`確定要刪除「${stations[idx].name}」嗎？`)) return;
    const removedUrl = stations[idx].url;
    stations.splice(idx, 1);
    favorites = favorites.filter(f => f !== removedUrl);
    if (currentStationIndex === idx) {
      audio.pause();
      currentStationIndex = -1;
      document.getElementById('nowPlayingTitle').textContent = '未選擇電臺';
    }
    await saveData();
    renderAllLists();
  }

  function exportStationsJSON() {
    const blob = new Blob([JSON.stringify(stations, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Roys_Radio_Stations_${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function handleImportFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      const content = e.target.result;
      let imported = [];
      try {
        if (file.name.toLowerCase().endsWith('.json')) {
          const parsed = JSON.parse(content);
          if (Array.isArray(parsed)) imported = parsed.filter(item => item.name && item.url);
        } else {
          const lines = content.split(/\r?\n/);
          let pendingName = '';
          for (const line of lines) {
            const trimmed = line.trim();
            if (trimmed.startsWith('#EXTINF:')) {
              const commaIdx = trimmed.indexOf(',');
              pendingName = commaIdx !== -1 ? trimmed.slice(commaIdx + 1).trim() : '匯入電臺';
            } else if (trimmed && !trimmed.startsWith('#')) {
              imported.push({ name: pendingName || '匯入電臺', url: trimmed, category: '綜合', isHls: trimmed.toLowerCase().includes('.m3u8') });
              pendingName = '';
            }
          }
        }
        let added = 0;
        imported.forEach(item => {
          if (!stations.some(s => s.url === item.url)) {
            stations.push({ name: item.name, url: item.url, category: item.category || '綜合', isHls: item.url.toLowerCase().includes('.m3u8') });
            added++;
          }
        });
        await saveData();
        renderAllLists();
        alert(`📥 匯入完成！共新增 ${added} 個不重複電臺。`);
      } catch (err) {
        alert('檔案格式解析失敗：' + err.message);
      }
      event.target.value = '';
    };
    reader.readAsText(file);
  }

  loadLocalData();

  (function restoreLastSession() {
    const savedVol = localStorage.getItem('roy_saved_volume');
    if (savedVol !== null) {
      audio.volume = parseFloat(savedVol);
      const slider = document.getElementById('volumeSlider');
      if (slider) slider.value = savedVol;
    }
    const lastUrl = localStorage.getItem('roy_last_station_url');
    if (lastUrl && stations.length > 0) {
      const foundIdx = stations.findIndex(s => s.url === lastUrl);
      if (foundIdx >= 0) {
        const banner = document.getElementById('resumeBanner');
        const txt = document.getElementById('resumeText');
        if (banner && txt) {
          txt.textContent = `🎧 上次收聽：${stations[foundIdx].name}`;
          banner.classList.remove('hidden');
        }
      }
    }
  })();

  function resumeLastStation() {
    const lastUrl = localStorage.getItem('roy_last_station_url');
    const foundIdx = stations.findIndex(s => s.url === lastUrl);
    if (foundIdx >= 0) startStream(foundIdx);
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
