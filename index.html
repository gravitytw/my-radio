    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.8)), 
                        url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background 0.5s ease;
            overflow-x: hidden;
            padding-bottom: 80px;
        }
        /* 會員驗證卡片 */
        .auth-container {
            background: rgba(20, 24, 35, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            color: #fff;
        }
        .auth-container h2 {
            margin-top: 0;
            font-size: 26px;
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
            letter-spacing: 1px;
        }
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #b3b3b3;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }
        .input-group input:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.3);
        }
        .auth-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .auth-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.4);
        }
        .auth-links {
            margin-top: 20px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }
        .auth-links a {
            color: #00ffcc;
            text-decoration: none;
            cursor: pointer;
        }
        .auth-links a:hover { text-decoration: underline; }
        
        /* 主播放器介面 */
        .player-container {
            display: none;
            background: rgba(15, 20, 30, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            max-width: 480px;
            color: #fff;
        }
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }
        .player-header h2 {
            margin: 0;
            font-size: 22px;
            background: linear-gradient(45deg, #00d2ff, #00a8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logout-link {
            color: #ff4d4d;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
        }
        
        /* 🌟 頂端正上方播放串流名稱提示框 */
        .top-station-banner {
            margin: 20px 0;
            padding: 15px;
            background: rgba(0, 210, 255, 0.06);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            color: #00ffcc;
            text-align: center;
            min-height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
            box-shadow: inset 0 0 15px rgba(0, 210, 255, 0.1);
        }
        
        audio {
            width: 100%;
            margin-bottom: 20px;
            filter: invert(0.9) hue-rotate(180deg);
        }
        .section-title {
            font-size: 13px;
            color: #8a99ad;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 25px 0 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 5px;
        }
        .station-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            max-height: 180px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        .station-list::-webkit-scrollbar, .admin-panel::-webkit-scrollbar {
            width: 6px;
        }
        .station-list::-webkit-scrollbar-thumb, .admin-panel::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }
        .station-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 2px 10px;
        }
        .station-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #e0e6ed;
            padding: 12px 0;
            font-size: 15px;
            cursor: pointer;
            text-align: left;
            font-weight: 500;
            outline: none;
        }
        .station-item.active {
            background: linear-gradient(90deg, rgba(0, 210, 255, 0.2), transparent);
            border-color: rgba(0, 210, 255, 0.4);
        }
        .station-item.active .station-btn { color: #00d2ff; }
        .delete-btn {
            background: transparent;
            border: none;
            color: #ff4d4d;
            font-size: 16px;
            cursor: pointer;
            padding: 8px;
            opacity: 0.6;
        }
        .delete-btn:hover { opacity: 1; }
        
        .admin-panel {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
        }
        .form-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .form-row input[type="text"] {
            width: 100%; padding: 10px 12px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px; color: white; font-size: 13px; outline: none;
        }
        .checkbox-row { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #b3b3b3; margin-bottom: 10px; }
        .action-btn { width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .add-btn { background: #00b894; color: white; margin-bottom: 12px; }
        .bg-controls { display: flex; gap: 10px; }
        .bg-btn { flex: 1; background: #6c5ce7; color: white; }
        #file-input { display: none; }

        /* 置底循環滾動跑馬燈 */
        .marquee-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 15, 25, 0.95);
            border-top: 2px solid #00d2ff;
            color: #00ffcc;
            padding: 14px 0;
            font-size: 15px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.6);
            z-index: 9999;
            display: none;
        }
        .marquee-content {
            display: inline-block;
            padding-left: 100%;
            animation: marquee-animation 28s linear infinite;
        }
        @keyframes marquee-animation {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
    </style>
</head>
