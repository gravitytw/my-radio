<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roy's 網路廣播播放器</title>
    <!-- 引入 HLS.js 用於順暢播放 HLS 安全串流 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.75)), 
                        url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background 0.5s ease;
        }
        /* 登入區塊 */
        .login-container {
            background: rgba(20, 24, 35, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            color: #fff;
        }
        .login-container h2 {
            margin-top: 0;
            font-size: 26px;
            letter-spacing: 2px;
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #b3b3b3;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }
        .input-group input:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 114, 255, 0.6);
        }
        /* 主播放器區塊 */
        .player-container {
            display: none;
            background: rgba(15, 20, 30, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            max-width: 480px;
            color: #fff;
        }
        .player-header h2 {
            margin: 0;
            font-size: 24px;
            text-align: center;
            background: linear-gradient(45deg, #00d2ff, #00a8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .now-playing {
            margin: 20px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid #00d2ff;
            border-radius: 4px;
            font-weight: bold;
            color: #00ffcc;
            text-align: center;
            min-height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        audio {
            width: 100%;
            margin-bottom: 20px;
            filter: invert(0.9) hue-rotate(180deg); /* 讓原生播放器變暗系 */
        }
        .section-title {
            font-size: 14px;
            color: #8a99ad;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 15px 0 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 5px;
        }
        .station-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 5px;
            margin-bottom: 20px;
        }
        /* 滾動條美化 */
        .station-list::-webkit-scrollbar, .admin-panel::-webkit-scrollbar {
            width: 6px;
        }
        .station-list::-webkit-scrollbar-thumb, .admin-panel::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }
        .station-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 2px 10px;
            transition: all 0.2s;
        }
        .station-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .station-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #e0e6ed;
            padding: 12px 0;
            font-size: 15px;
            cursor: pointer;
            text-align: left;
            font-weight: 500;
            outline: none;
        }
        .station-item.active {
            background: linear-gradient(90deg, rgba(0, 210, 255, 0.2), transparent);
            border-color: rgba(0, 210, 255, 0.4);
        }
        .station-item.active .station-btn {
            color: #00d2ff;
        }
        .delete-btn {
            background: transparent;
            border: none;
            color: #ff4d4d;
            font-size: 16px;
            cursor: pointer;
            padding: 8px;
            border-radius: 4px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .delete-btn:hover {
            opacity: 1;
            background: rgba(255, 77, 77, 0.1);
        }
        /* 管理面板 */
        .admin-panel {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .form-row input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            color: white;
            font-size: 13px;
            outline: none;
        }
        .form-row input[type="text"]:focus {
            border-color: #00d2ff;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #b3b3b3;
            margin-bottom: 10px;
        }
        .action-btn {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .add-btn {
            background: #00b894;
            color: white;
        }
        .add-btn:hover { background: #00a383; }
        
        .bg-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .bg-btn {
            flex: 1;
            background: #6c5ce7;
            color: white;
        }
        .bg-btn:hover { background: #5b4cc4; }
        
        #file-input {
            display: none;
        }
    </style>
</head>
<body>

<!-- 登入卡片 -->
<div class="login-container" id="login-card">
    <h2>Roy's Radio</h2>
    <div style="margin-bottom: 25px; color:#aaa; font-size:14px;">請輸入憑證以存取系統</div>
    <div class="input-group">
        <label for="username">使用者帳號</label>
        <input type="text" id="username" placeholder="請輸入帳號" autocomplete="off">
    </div>
    <div class="input-group">
        <label for="password">安全密碼</label>
        <input type="password" id="password" placeholder="請輸入密碼">
    </div>
    <button class="login-btn" onclick="checkLogin()">驗證並登入</button>
</div>

<!-- 播放器卡片 -->
<div class="player-container" id="player-card">
    <div class="player-header">
        <h2>🌌 Roy的廣播電臺</h2>
    </div>
    
    <div class="now-playing" id="current-title">請選擇右側電臺或新增串流</div>
    
    <audio id="radio-player" controls></audio>

    <div class="section-title">📻 收聽清單</div>
    <div class="station-list" id="station-list-box">
        <!-- 電臺列表將由 JavaScript 動態渲染 -->
    </div>

    <div class="section-title">🛠️ 管理面板</div>
    <div class="admin-panel">
        <div class="form-row">
            <input type="text" id="new-name" placeholder="電臺名稱（例：中廣流行網）">
        </div>
        <div class="form-row">
            <input type="text" id="new-url" placeholder="串流網址 (https://...)">
        </div>
        <div class="checkbox-row">
            <input type="checkbox" id="new-ishls">
            <label for="new-ishls">這是 HLS 串流 (警廣等 .m3u8 格式請勾選)</label>
        </div>
        <button class="action-btn add-btn" onclick="addNewStation()">➕ 新增此電臺</button>
        
        <div class="bg-controls">
            <button class="action-btn bg-btn" onclick="changeBgUrl()">🖼️ 貼網址換背景</button>
            <button class="action-btn bg-btn" onclick="document.getElementById('file-input').click()">📁 上傳背景圖</button>
            <input type="file" id="file-input" accept="image/*" onchange="changeBgFile(event)">
        </div>
    </div>
</div>

<script>
    // 1. 設定固定的帳號密碼
    const AUTH_USER = "Roy";
    const AUTH_PASS = "654321";

    // 2. 初始預設電臺清單
    const defaultStations = [
        { name: "🟢 警廣台中分臺 (TCS)", url: "https://stream.pbs.gov.tw/live/TCS/playlist.m3u8", isHls: true },
        { name: "🔵 中廣流行網", url: "https://sonnykuo.appspot.com/bcc/?id=中廣流行網", isHls: false },
        { name: "🔵 中廣新聞網", url: "https://sonnykuo.appspot.com/bcc/?id=中廣新聞網", isHls: false },
        { name: "🔵 中廣音樂網", url: "https://sonnykuo.appspot.com/bcc/?id=中廣音樂網", isHls: false },
        { name: "🟠 飛碟聯播網", url: "https://stream.rcs.revma.com/em90w4aeewzuv.m4a", isHls: false },
        { name: "🔴 全國廣播 M-Radio", url: "https://stream.rcs.revma.com/044q61ha7a0uv", isHls: false }
    ];

    let stations = [];
    const audio = document.getElementById('radio-player');
    const titleDiv = document.getElementById('current-title');
    let hls = null;

    // 登入驗證
    function checkLogin() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value;

        if (u === AUTH_USER && p === AUTH_PASS) {
            document.getElementById('login-card').style.display = 'none';
            document.getElementById('player-card').style.display = 'block';
            initPlayer();
        } else {
            alert('帳號或密碼錯誤，請重新輸入。');
        }
    }

    // 初始化播放器
    function initPlayer() {
        // 讀取自訂背景
        const savedBg = localStorage.getItem('roy_radio_bg');
        if (savedBg) {
            document.body.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.75)), url('${savedBg}')`;
        }

        // 讀取電臺記憶體
        const savedStations = localStorage.getItem('roy_radio_stations');
        if (savedStations) {
            stations = JSON.parse(savedStations);
        } else {
            stations = [...defaultStations];
            localStorage.setItem('roy_radio_stations', JSON.stringify(stations));
        }
        renderStations();
    }

    // 渲染電臺列表到畫面上
    function renderStations() {
        const box = document.getElementById('station-list-box');
        box.innerHTML = '';
        
        stations.forEach((st, index) => {
            const item = document.createElement('div');
            item.className = 'station-item';
            item.id = `st-item-${index}`;
            
            const btn = document.createElement('button');
            btn.className = 'station-btn';
            btn.textContent = st.name;
            btn.onclick = () => playStation(st.name, st.url, item, st.isHls);
            
            const del = document.createElement('button');
            del.className = 'delete-btn';
            del.innerHTML = '🗑️';
            del.title = '刪除此電臺';
            del.onclick = (e) => {
                e.stopPropagation();
                deleteStation(index);
            };
            
            item.appendChild(btn);
            item.appendChild(del);
            box.appendChild(item);
        });
    }

    // 播放電臺
    function playStation(name, url, element, isHls) {
        document.querySelectorAll('.station-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        titleDiv.textContent = `正在播放：${name}`;

        if (hls) {
            hls.destroy();
            hls = null;
        }

        if (isHls) {
            if (Hls.isSupported()) {
                hls = new Hls({ maxMaxBufferLength: 10 });
                hls.loadSource(url);
                hls.attachMedia(audio);
                hls.on(Hls.Events.MANIFEST_PARSED, () => audio.play().catch(() => {}));
            } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                audio.src = url;
                audio.addEventListener('loadedmetadata', () => audio.play().catch(() => {}));
            } else {
                alert('瀏覽器不支援播放此 HLS 串流格式。');
            }
        } else {
            audio.src = url;
            audio.load();
            audio.play().catch(err => console.log("自動播放被攔截，請手動按播放。"));
        }
    }

    // 新增電臺
    function addNewStation() {
        const nameInput = document.getElementById('new-name');
        const urlInput = document.getElementById('new-url');
        const isHlsCheck = document.getElementById('new-ishls');

        const name = nameInput.value.trim();
        const url = urlInput.value.trim();
        const isHls = isHlsCheck.checked;

        if (!name || !url) {
            alert('請輸入完整的電臺名稱與串流網址！');
            return;
        }

        stations.push({ name, url, isHls });
        localStorage.setItem('roy_radio_stations', JSON.stringify(stations));
        renderStations();

        // 清空輸入框
        nameInput.value = '';
        urlInput.value = '';
        isHlsCheck.checked = false;
    }

    // 刪除電臺
    function deleteStation(index) {
        if (confirm(`確定要刪除「${stations[index].name}」嗎？`)) {
            stations.splice(index, 1);
            localStorage.setItem('roy_radio_stations', JSON.stringify(stations));
            renderStations();
            audio.src = '';
            titleDiv.textContent = '請選擇電臺收聽';
        }
    }

    // 更換背景 (貼圖片網址)
    function changeBgUrl() {
        const url = prompt('請輸入網路圖片的完整 URL 網址：');
        if (url && url.trim() !== '') {
            document.body.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.75)), url('${url}')`;
            localStorage.setItem('roy_radio_bg', url);
        }
    }

    // 更換背景 (本地端上傳圖片檔案)
    function changeBgFile(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Url = e.target.result;
                document.body.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.75)), url('${base64Url}')`;
                try {
                    localStorage.setItem('roy_radio_bg', base64Url);
                } catch (error) {
                    alert('圖片檔案太大，雖然當前可以顯示，但瀏覽器可能無法永久記住它。建議上傳小於 2MB 的圖片或使用網址換背景！');
                }
            };
            reader.readAsDataURL(file);
        }
    }

    // 綁定鍵盤 Enter 鍵方便登入
    document.getElementById('password').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') checkLogin();
    });
</script>

</body>
</html>
