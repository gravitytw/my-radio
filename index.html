<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roy's 雲端網路廣播播放器 // CYBER HUD</title>
  <!-- 載入科技字體與 HLS.js 串流播放核心 -->
  <link href="https://googleapis.com" rel="stylesheet">
  <script src="https://jsdelivr.net"></script>
  <style>
    :root {
      --bg-void: #050811;
      --panel-bg: rgba(12, 20, 38, 0.75);
      --neon-cyan: #00f3ff;
      --neon-purple: #bc13fe;
      --neon-pink: #ff0055;
      --text-main: #e2e8f0;
      --text-dim: #7dd3fc;
      --border-glow: rgba(0, 243, 255, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-void);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(188, 19, 254, 0.16), transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(0, 243, 255, 0.14), transparent 40%),
        linear-gradient(rgba(0, 243, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
      color: var(--text-main);
      font-family: 'Noto Sans TC', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 28px 16px;
    }

    .hud-wrapper {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .main-title {
      font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
      text-align: center;
      font-size: 1.65rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(90deg, var(--neon-cyan), #ffffff, var(--neon-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 22px rgba(0, 243, 255, 0.45);
      margin-bottom: 4px;
    }
    .cyber-card {
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-glow);
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.65), inset 0 0 18px rgba(0, 243, 255, 0.06);
      position: relative;
      overflow: hidden;
    }

    .cyber-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-purple), transparent);
    }

    h2 {
      font-size: 1.15rem;
      color: var(--neon-cyan);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"],
    input[type="url"],
    select {
      width: 100%;
      padding: 11px 14px;
      background: rgba(5, 10, 22, 0.88);
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-radius: 8px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.25s ease;
    }

    input:focus, select:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.35);
    }

    .btn {
      width: 100%;
      padding: 11px 16px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.25s ease;
      margin-top: 6px;
    }

    .btn-primary {
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.2), rgba(188, 19, 254, 0.25));
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      box-shadow: 0 0 14px rgba(0, 243, 255, 0.2);
    }

    .btn-primary:hover {
      background: var(--neon-cyan);
      color: #050811;
      box-shadow: 0 0 22px rgba(0, 243, 255, 0.65);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #cbd5e1;
    }

    .btn-secondary:hover {
      border-color: #ffffff;
      color: #ffffff;
    }

    .btn-danger {
      background: rgba(255, 0, 85, 0.15);
      border: 1px solid var(--neon-pink);
      color: #ff4d88;
    }

    .btn-danger:hover {
      background: var(--neon-pink);
      color: #ffffff;
      box-shadow: 0 0 18px rgba(255, 0, 85, 0.55);
    }

    .link-row {
      margin-top: 14px;
      text-align: center;
      font-size: 0.88rem;
      color: var(--text-dim);
    }

    .link-row span {
      cursor: pointer;
      text-decoration: underline;
      margin: 0 6px;
    }

    .link-row span:hover {
      color: var(--neon-cyan);
    }

    .visualizer {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 5px;
      height: 36px;
      margin: 14px 0;
      padding: 6px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 8px;
      border: 1px solid rgba(0, 243, 255, 0.15);
    }

    .bar {
      width: 5px;
      height: 6px;
      background: linear-gradient(to top, var(--neon-purple), var(--neon-cyan));
      border-radius: 3px;
      transition: height 0.2s ease;
    }

    .playing .bar {
      animation: eq 0.8s ease-in-out infinite alternate;
    }

    .playing .bar:nth-child(odd) { animation-duration: 0.55s; }
    .playing .bar:nth-child(3n) { animation-duration: 0.95s; }
    .playing .bar:nth-child(4n) { animation-duration: 0.65s; }

    @keyframes eq {
      0% { height: 5px; }
      100% { height: 26px; }
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 12px 0;
      font-size: 0.88rem;
      color: var(--text-dim);
      cursor: pointer;
    }

    .checkbox-row input {
      accent-color: var(--neon-cyan);
      width: 16px;
      height: 16px;
    }

    audio {
      width: 100%;
      margin-top: 10px;
      filter: invert(92%) hue-rotate(155deg) brightness(1.05);
      border-radius: 8px;
    }

    .station-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(0, 243, 255, 0.18);
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .station-actions button {
      padding: 4px 10px;
      margin-left: 6px;
      border-radius: 6px;
      border: 1px solid var(--neon-cyan);
      background: transparent;
      color: var(--neon-cyan);
      cursor: pointer;
      font-size: 0.8rem;
    }

    .station-actions button.del {
      border-color: var(--neon-pink);
      color: var(--neon-pink);
    }

    .hidden { display: none !important; }
    .btn-row { display: flex; gap: 10px; }
  </style>
</head>
<body>
<div class="hud-wrapper">
  <h1 class="main-title">⚡ Roy's 雲端網路廣播播放器</h1>

  <div id="login-section" class="cyber-card">
    <h2>📻 Roy's Radio 登入</h2>
    <div class="form-group">
      <label>電子郵件 (Email)</label>
      <input type="email" id="login-email" placeholder="輸入您的 Email" />
    </div>
    <div class="form-group">
      <label>安全密碼</label>
      <input type="password" id="login-password" placeholder="輸入安全密碼" />
    </div>
    <button class="btn btn-primary" onclick="handleLogin()">驗證並登入</button>
    <div class="link-row">
      <span onclick="switchView('register-section')">申請註冊新帳號</span> | 
      <span onclick="switchView('reset-section')">忘記密碼？</span>
    </div>
  </div>
  <!-- 申請新帳號與重設密碼區塊請接續貼上 -->
  <div id="register-section" class="cyber-card hidden">...</div>
  <div id="reset-section" class="cyber-card hidden">...</div>
  <div id="radio-dashboard" class="hidden" style="display:flex; flex-direction:column; gap:20px;">
    <div class="cyber-card">
      <p style="font-size:0.85rem; color:var(--text-dim); margin-bottom:8px;">歡迎來到 Roy 的廣播電臺，請選擇電臺開始收聽...</p>
      <h2>🌌 Roy 的廣播電臺</h2>
      <div class="visualizer" id="visualizer">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      </div>
      <div class="form-group">
        <label>📻 收聽清單</label>
        <select id="station-select" onchange="playSelectedStation()">
          <option value="">-- 請選擇電臺 --</option>
        </select>
      </div>
      <audio id="audio-player" controls></audio>
    </div>
    <div class="cyber-card">
      <h2>🛠 管理面板 (新增自訂串流)</h2>
      <div class="form-group">
        <label>電臺名稱</label>
        <input type="text" id="station-name" placeholder="例如：警廣全國治安交通網" />
      </div>
      <div class="form-group">
        <label>串流網址 (URL)</label>
        <input type="url" id="station-url" placeholder="https://... (.m3u8 或 .mp3)" />
      </div>
      <label class="checkbox-row">
        <input type="checkbox" id="is-hls" />
        <span>這是 HLS 串流 (警廣等 .m3u8 格式請勾選)</span>
      </label>
      <div class="btn-row">
        <button class="btn btn-primary" id="save-station-btn" onclick="saveStation()">➕ 新增此電臺</button>
        <button class="btn btn-secondary hidden" id="cancel-edit-btn" onclick="cancelEdit()">取消修改</button>
      </div>
    </div>

    <div class="cyber-card">
      <h2>📋 電台列表清單管理</h2>
      <div id="station-list-container"></div>
    </div>

    <div class="cyber-card">
      <h2>🔐 修改帳號密碼 (<span id="current-user-email"></span>)</h2>
      <div class="form-group">
        <input type="password" id="new-user-pass" placeholder="輸入新密碼 (至少6碼)" />
      </div>
      <button class="btn btn-primary" onclick="updatePassword()">💾 更新帳號密碼</button>
      <button class="btn btn-danger" style="margin-top:12px;" onclick="handleLogout()">登出電臺</button>
    </div>
  </div>
</div>
<script>
  const defaultStations = [
    { name: "警廣全國治安交通網 (HLS)", url: "https://pbs.gov.tw", isHls: true },
    { name: "警廣臺北分臺 (HLS)", url: "https://pbs.gov.tw", isHls: true }
  ];

  let stations = JSON.parse(localStorage.getItem('roy_radio_stations')) || defaultStations;
  let editIndex = -1;
  let hlsInstance = null;

  const audio = document.getElementById('audio-player');
  const visualizer = document.getElementById('visualizer');

  audio.addEventListener('play', () => visualizer.classList.add('playing'));
  audio.addEventListener('pause', () => visualizer.classList.remove('playing'));
  audio.addEventListener('ended', () => visualizer.classList.remove('playing'));

  function switchView(viewId) {
    ['login-section', 'register-section', 'reset-section', 'radio-dashboard'].forEach(id => {
      document.getElementById(id).classList.add('hidden');
    });
    document.getElementById(viewId).classList.remove('hidden');
  }

  function handleLogin() {
    const email = document.getElementById('login-email').value.trim();
    const pass = document.getElementById('login-password').value;
    if (!email || pass.length < 6) { alert('請輸入有效的 Email 與至少 6 碼密碼'); return; }
    localStorage.setItem('roy_radio_user', email);
    document.getElementById('current-user-email').textContent = email;
    switchView('radio-dashboard');
    renderStations();
  }

  function handleRegister() {
    const email = document.getElementById('reg-email').value.trim();
    const pass = document.getElementById('reg-password').value;
    if (!email || pass.length < 6) { alert('請設定有效 Email 與至少 6 碼密碼'); return; }
    localStorage.setItem('roy_radio_user', email);
    document.getElementById('current-user-email').textContent = email;
    alert('帳號申請成功並已自動登入！');
    switchView('radio-dashboard');
    renderStations();
  }

  function handleReset() {
    const email = document.getElementById('reset-email').value.trim();
    const p1 = document.getElementById('reset-new-pass').value;
    const p2 = document.getElementById('reset-confirm-pass').value;
    if (!email || p1.length < 6 || p1 !== p2) { alert('請確認資料填寫正確且兩次密碼一致'); return; }
    alert('安全密碼已重設！請使用新密碼登入。');
    switchView('login-section');
  }

  function updatePassword() {
    const newPass = document.getElementById('new-user-pass').value;
    if (newPass.length < 6) { alert('新密碼至少需要 6 碼'); return; }
    document.getElementById('new-user-pass').value = '';
    alert('帳號密碼已成功更新！');
  }

  function handleLogout() {
    audio.pause();
    localStorage.removeItem('roy_radio_user');
    switchView('login-section');
  }
  function renderStations() {
    const select = document.getElementById('station-select');
    const list = document.getElementById('station-list-container');
    select.innerHTML = '<option value="">-- 請選擇電臺 --</option>';
    list.innerHTML = '';

    stations.forEach((st, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = st.name;
      select.appendChild(opt);

      const item = document.createElement('div');
      item.className = 'station-item';
      item.innerHTML = `
        <span>${st.name} ${st.isHls ? '<small style="color:var(--neon-cyan)">[HLS]</small>' : ''}</span>
        <div class="station-actions">
          <button onclick="editStation(${idx})">編輯</button>
          <button class="del" onclick="deleteStation(${idx})">刪除</button>
        </div>
      `;
      list.appendChild(item);
    });
    localStorage.setItem('roy_radio_stations', JSON.stringify(stations));
  }

  function playSelectedStation() {
    const idx = document.getElementById('station-select').value;
    if (idx === '') return;
    const st = stations[idx];

    if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

    if (st.isHls && Hls.isSupported()) {
      hlsInstance = new Hls();
      hlsInstance.loadSource(st.url);
      hlsInstance.attachMedia(audio);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => audio.play());
    } else {
      audio.src = st.url;
      audio.play();
    }
  }

  function saveStation() {
    const name = document.getElementById('station-name').value.trim();
    const url = document.getElementById('station-url').value.trim();
    const isHls = document.getElementById('is-hls').checked;
    if (!name || !url) { alert('請填寫電臺名稱與串流網址'); return; }

    if (editIndex >= 0) {
      stations[editIndex] = { name, url, isHls };
      cancelEdit();
    } else {
      stations.push({ name, url, isHls });
    }
    document.getElementById('station-name').value = '';
    document.getElementById('station-url').value = '';
    document.getElementById('is-hls').checked = false;
    renderStations();
  }

  function editStation(idx) {
    editIndex = idx;
    document.getElementById('station-name').value = stations[idx].name;
    document.getElementById('station-url').value = stations[idx].url;
    document.getElementById('is-hls').checked = stations[idx].isHls;
    document.getElementById('save-station-btn').textContent = '💾 儲存修改';
    document.getElementById('cancel-edit-btn').classList.remove('hidden');
  }

  function cancelEdit() {
    editIndex = -1;
    document.getElementById('station-name').value = '';
    document.getElementById('station-url').value = '';
    document.getElementById('is-hls').checked = false;
    document.getElementById('save-station-btn').textContent = '➕ 新增此電臺';
    document.getElementById('cancel-edit-btn').classList.add('hidden');
  }

  function deleteStation(idx) {
    if (!confirm('確定要刪除此電臺嗎？')) return;
    stations.splice(idx, 1);
    renderStations();
  }

  window.addEventListener('DOMContentLoaded', () => {
    const savedUser = localStorage.getItem('roy_radio_user');
    if (savedUser) {
      document.getElementById('current-user-email').textContent = savedUser;
      switchView('radio-dashboard');
      renderStations();
    }
  });
</script>
</body>
</html>
